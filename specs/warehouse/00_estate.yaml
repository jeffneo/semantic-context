# -----------------------------------------------------------------------------
# Teams and human principals
# -----------------------------------------------------------------------------
# Everyone is fictional. `reads` lists the datasets a team can read (dataset
# ACLs; a wildcard never grants a restricted dataset - those need an explicit
# entry); `home` is where it spends most of its query volume. `sql_style`
# drives the template generator: how messy, how long, how many CTEs.
teams:
  data_engineering:
    home: [dw_staging, dw_intermediate, dw_core, data_quality]
    reads: ["*"]
    tools: [bigquery_console, dbt_cloud_ide]
    sql_style: {skill: expert, ad_hoc_share: 0.15}
    members: [marcus.lindqvist, aiko.tanaka-reyes, ben.adeyemi]
