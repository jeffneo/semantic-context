# =============================================================================
# Fennmoor Bank - BigQuery estate: ground truth
# =============================================================================
# Fennmoor Bank is fictional: a US regional retail bank, ~$28B in assets,
# ~2.1M retail customers, 164 branches, three contact-center sites (two owned,
# one outsourced BPO). The bank name and domain are defined once here; rename
# by changing `org`.
#
# This file defines the estate - projects, datasets, teams, principals and the
# simulated log window. Tables live in the other files in this directory.
#
# Column DSL, used everywhere a table lists columns:
#   "name | TYPE | expr | concept | flags"
#   - TYPE    BigQuery type. STRUCT/ARRAY allowed. No `|` inside.
#   - expr    Derived tables only: BigQuery SQL over the table's `from` aliases.
#             Must not contain `|` (use CONCAT, not ||).
#   - concept Id from concepts.yaml. Required for identifiers, PII and money.
#   - flags   Space-separated: pk, required, pii=<kind>, unit=<cents|usd|bps|pct|sec|ms>,
#             always_null, deprecated, policy=restricted
#   Trailing empty fields may be omitted.
# =============================================================================

org:
  name: Fennmoor Bank
  domain: fennmoorbank.com
  region: US              # BigQuery multi-region for every dataset

# Simulated INFORMATION_SCHEMA.JOBS window. Dated events inside it are what
# make recency, migration and deprecation findings observable in the log.
log_window:
  start: 2026-04-01
  days: 90
  timezone: America/Chicago   # business hours / cron times are local
  events:
    - date: 2026-05-15
      id: churn_v3_cutover
      what: >-
        ml_scores.churn_score_v3 replaces churn_score_v2. Vertex batch scoring
        switches to v3; v2 stops being written but is still read by two Looker
        explores and one analyst for the rest of the window.
    - date: 2026-04-20
      id: branch_pref_dropped
      what: >-
        Core banking stops populating CUSTOMER.PREF_BRNCH_ID (field retired in
        the core upgrade). The column stays in the schema; dim_customer keeps
        selecting it, so everything downstream reads an always-null column.
    - date: 2026-06-02
      id: genesys_wrapup_v2
      what: >-
        Contact center adds new wrap-up codes for account-closure calls. Before
        this date, closures are coded 'ACCT_MAINT'; after, 'ACCT_CLOSE'.

# -----------------------------------------------------------------------------
# Projects and datasets
# -----------------------------------------------------------------------------
# Three projects, which is typical: landing, modeled warehouse, analytics.
# For validation these logical project ids are mapped onto one real GCP
# project (see specs/GCP_SETUP.md); the generated SQL always uses the logical
# ids so the log looks like a real multi-project estate.
projects:
  fennmoor-raw:
    purpose: Landing zone. Written only by ingestion principals.
  fennmoor-dw:
    purpose: dbt-modeled warehouse. Written only by dbt-prod and Vertex scoring.
  fennmoor-analytics:
    purpose: >-
      Legacy EDW lift-and-shift, BI scratch, reverse-ETL, data quality and
      team/personal sandboxes. Where most of the mess lives.

# layer: raw | staging | intermediate | mart | ml | legacy | bi | sandbox | ops
datasets:
  # ---- fennmoor-raw --------------------------------------------------------
  core_banking_cdc:      {project: fennmoor-raw, layer: raw, source: core_banking, domain: deposits}
  card_processor:        {project: fennmoor-raw, layer: raw, source: card_processor, domain: cards}
  loan_origination:      {project: fennmoor-raw, layer: raw, source: los, domain: lending}
  salesforce:            {project: fennmoor-raw, layer: raw, source: salesforce, domain: customer}
