# -----------------------------------------------------------------------------
# Service accounts
# -----------------------------------------------------------------------------
# In a real log these issue 60-80% of all jobs. `share` is the target share of
# total job count; `pattern` tells the simulator how its SQL behaves.
service_accounts:
  fivetran-sync:
    email: g-sunny-marmot@fivetran-production.iam.gserviceaccount.com
    project: fennmoor-raw
    share: 0.18
    pattern: MERGE into raw tables every 15-60 min per connector
    writes: [card_processor, loan_origination, salesforce, genesys_cloud, digital_banking, braze, fraud_platform, aml_kyc, gl_erp, workday]
  ga4-export:
    email: firebase-measurement@system.gserviceaccount.com
    project: fennmoor-raw
    share: 0.0     # GA4 daily export is a LOAD job, not a query job
    pattern: daily LOAD into analytics_312874659.events_YYYYMMDD
  dbt-prod:
    email: dbt-prod@fennmoor-dw.iam.gserviceaccount.com
    project: fennmoor-dw
    share: 0.24
    pattern: >-
      Nightly 02:00 full build plus hourly incremental for event models.
      CREATE OR REPLACE TABLE / MERGE generated from each model's `from` +
      column exprs. Also dbt test queries (not_null, unique, relationships).
    writes: [dw_staging, dw_intermediate, dw_core, dw_customer, dw_contact_center, dw_digital, dw_marketing, dw_risk, dw_finance, dw_compliance, ml_features]
  vertex-scoring:
    email: vertex-batch@fennmoor-dw.iam.gserviceaccount.com
    project: fennmoor-dw
    share: 0.02
    pattern: Nightly batch prediction; reads ml_features, writes ml_scores
    writes: [ml_scores]
  composer-legacy:
    email: composer-legacy@fennmoor-analytics.iam.gserviceaccount.com
    project: fennmoor-analytics
    share: 0.03
    pattern: >-
      Old Airflow DAGs from the Teradata migration. Still feeds the handful of
      legacy_edw tables marked `refresh: composer-legacy` in legacy_edw.
    writes: [legacy_edw]
  looker-prod:
    email: looker-prod@fennmoor-analytics.iam.gserviceaccount.com
    project: fennmoor-analytics
    share: 0.22
    pattern: >-
      Dashboard and explore queries, highly repetitive, parameterized by date
      range and filters. Builds PDTs in looker_scratch.
    writes: [looker_scratch]
  tableau-finance:
    email: svc-tableau-finance@fennmoor-analytics.iam.gserviceaccount.com
    project: fennmoor-analytics
    share: 0.03
    pattern: >-
      Nightly extract refreshes. Full-table SELECTs with no partition filter -
      small job count, very large bytes.
  hightouch-sync:
    email: hightouch-sync@fennmoor-analytics.iam.gserviceaccount.com
    project: fennmoor-analytics
    share: 0.02
    pattern: Hourly reads of reverse_etl models; diffs against previous sync
    writes: [reverse_etl]
  file-loader:
    email: sftp-ingest-fn@fennmoor-raw.iam.gserviceaccount.com
    project: fennmoor-raw
    share: 0.01
    pattern: Cloud Function that LOADs vendor SFTP files (card processor daily, bureau monthly)
    writes: [card_processor, credit_bureau]
  amplitude-export:
    email: amplitude-export@fennmoor-raw.iam.gserviceaccount.com
    project: fennmoor-raw
    share: 0.01
    pattern: Amplitude's hourly BigQuery export, as LOAD jobs
    writes: [amplitude_mobile]
  elementary-dq:
    email: elementary@fennmoor-analytics.iam.gserviceaccount.com
    project: fennmoor-analytics
    share: 0.06
    pattern: >-
      Data-observability monitors: COUNT(*), MAX(loaded_at), null-rate and
      volume checks against nearly every table, every few hours. Deliberate
      confound - touches everything, so naive co-usage graphs get polluted.
    writes: [data_quality]

# -----------------------------------------------------------------------------
# Ingestion mixins - columns every table from a given loader carries
# -----------------------------------------------------------------------------
# `loaded_at` is the expression staging uses for its _loaded_at column;
# `filter` is the soft-delete predicate staging applies.
mixins:
  datastream:
    columns: ["datastream_metadata | STRUCT<uuid STRING, source_timestamp INT64>"]
    loaded_at: TIMESTAMP_MILLIS(src.datastream_metadata.source_timestamp)
  fivetran:
    columns: ["_fivetran_synced | TIMESTAMP", "_fivetran_deleted | BOOL"]
    loaded_at: src._fivetran_synced
    filter: NOT src._fivetran_deleted
  fivetran_salesforce:
    columns:
      - "is_deleted | BOOL"
      - "created_date | TIMESTAMP"
      - "created_by_id | STRING || crm.user_id"
      - "last_modified_date | TIMESTAMP"
      - "last_modified_by_id | STRING || crm.user_id"
      - "system_modstamp | TIMESTAMP"
      - "_fivetran_synced | TIMESTAMP"
      - "_fivetran_deleted | BOOL"
    keep: [created_date, last_modified_date]
    loaded_at: src._fivetran_synced
    filter: NOT src.is_deleted AND NOT src._fivetran_deleted
  sftp_file:
    # Not _file_*: BigQuery reserves the _FILE_ prefix for column names.
    columns: ["_source_file | STRING", "_source_file_date | DATE", "_load_ts | TIMESTAMP"]
    keep: [_source_file_date]
    loaded_at: src._load_ts
  manual_upload:
    columns: ["_uploaded_at | TIMESTAMP", "_uploaded_by | STRING"]
    loaded_at: src._uploaded_at

# -----------------------------------------------------------------------------
# Subjects - ground truth for clustering
# -----------------------------------------------------------------------------
