  analytics_312874659:   {project: fennmoor-raw, layer: raw, source: ga4, domain: digital}
  amplitude_mobile:      {project: fennmoor-raw, layer: raw, source: amplitude, domain: digital}
  digital_banking:       {project: fennmoor-raw, layer: raw, source: olb_platform, domain: digital}
