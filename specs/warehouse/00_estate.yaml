  customer:
    customer_master: The customer record itself.
    customer_contact_points: Addresses, phones, emails.
    customer_identity: Crosswalks between customer id spaces.
    household: Households / relationships.
    customer_analytics: 360 views, monthly summaries, value and segments.
  deposits:
    deposit_accounts: Checking, savings, money market, CD accounts.
    account_holders: Who holds which account.
    balances: Daily balances.
    deposit_transactions: Posted deposit transactions.
    fees: Fees assessed, waived, reversed.
    interest: Interest accrual and payment.
    account_lifecycle: Opens, closures, status changes.
  cards:
    card_accounts: Credit card accounts.
    cards: Plastics and virtual cards.
    card_authorizations: Authorization requests.
    card_transactions: Settled card transactions.
    merchants: Merchants and MCCs.
    disputes: Disputes and chargebacks.
    card_statements: Monthly statements.
    rewards: Rewards points.
