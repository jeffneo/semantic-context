dataset: sbx_finance
defaults: {materialized: ctas, writer: ruth.esposito, refresh: manual}
tables:
  - name: cc_cost_per_call_fy25
    subject: cc_performance
    cadence: monthly
    trap: F04
    desc: >-
      "CC cost per call": joins COST CENTER expenses to CONTACT CENTER volumes
      on CC_ID = SITE_CD - two different meanings of CC. Returns nothing.
    from: |
      ref(legacy_edw.CC_EXPNS_MTHLY) e
      JOIN ref(legacy_edw.CC_CALL_VOL_DLY) v ON v.SITE_CD = e.CC_ID
    group_by: all
    columns:
      - "fiscal_period | STRING | e.FISC_PRD"
      - "cc_id | STRING | e.CC_ID | finance.cost_center_id"
      - "expense | NUMERIC | SUM(e.ACTL_AMT) | money.cost | unit=usd"
      - "calls | INT64 | SUM(v.CALLS_HNDLD) | metric.count"

  - name: eom_bal_by_product_tableau
    subject: balances
    cadence: daily
    writer: victor.almeida
    planted: F05
    desc: Tableau's month-end balance source. Reads the deprecated legacy chain.
    from: |
      ref(legacy_edw.EOM_BAL_SNAP) e
      LEFT JOIN ref(stg_ref__product_hierarchy) p ON p.prod_cd = e.PROD_CD
    group_by: all
    columns:
      - "snap_month | DATE | e.SNAP_MTH | date.month"
      - "reporting_category | STRING | p.reporting_category"
      - "eom_balance | NUMERIC | SUM(e.EOM_BAL_AMT) | money.balance | unit=usd"
