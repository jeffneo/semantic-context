dataset: sbx_marketing
defaults: {materialized: ctas, writer: dana.whitfield, refresh: manual}
tables:
  - name: attrition_propensity_2025
    subject: churn_models
    upstream: [dw_customer.customer_360, sbx_dana_whitfield.dana_attrition_training_set]
    planted: F10
    desc: >-
      Marketing's own churn model, trained in BigQuery ML and scored with
      ML.PREDICT. Same concept as ml_scores.churn_score_v3 under another name.
    grain: cif_number, model_run_date
    rows: 8200000
    columns:
      - "cif_number | STRING || customer.cif"
      - "model_run_date | DATE || date.day"
      - "attrition_propensity | FLOAT64 || score.churn_probability"
      - "decile | INT64"

  - name: campain_results_2025
    writer: luis.carvajal
    cadence: weekly
    subject: engagement
    desc: Campaign results roll-up. The name has the typo it was created with.
    from: |
      ref(fct_campaign_engagement) e
      LEFT JOIN ref(dim_campaign) c ON c.campaign_id = e.campaign_id
    group_by: all
    columns:
      - "campaign_id | STRING | e.campaign_id | campaign.id"
      - "campaign_name | STRING | c.campaign_name"
      - "delivered | INT64 | COUNTIF(e.delivered) | metric.count"
      - "opens | INT64 | COUNTIF(e.opened) | metric.count"
      - "clicks | INT64 | COUNTIF(e.clicked) | metric.count"
      - "unsubscribes | INT64 | COUNTIF(e.unsubscribed) | metric.count"
      - "open_rate | FLOAT64 | SAFE_DIVIDE(COUNTIF(e.opened), COUNTIF(e.delivered))"

  - name: email_list_affluent_apr26
    subject: audiences
    copy_of: dw_customer.customer_360
    where: s.segment IN ('affluent', 'private')
    drop: [card_txn_count_90d, contacts_90d, closure_calls_90d, web_sessions_30d, churn_risk_band]
    created: 2026-04-06
    desc: Email list extract for an April campaign. Contains names and emails.

  - name: card_spend_by_segment
    writer: luis.carvajal
    subject: card_transactions
    planted: F12
    desc: >-
      Card spend by segment, built from the RAW processor feed. The spend
      column is named _usd but holds CENTS - off by 100x against any dollar
      table it is compared with.
    from: |
      ref(card_processor.settlement) s
      JOIN ref(card_processor.card_account) ca ON ca.account_id = s.account_id
      JOIN ref(dim_customer) c ON c.cif_number = ca.bank_customer_ref
    where: s.txn_type = 'PURCH'
    group_by: all
    columns:
      - "segment | STRING | c.segment | customer.segment"
      - "month_start | DATE | DATE_TRUNC(s.post_date, MONTH) | date.month"
      - "card_spend_usd | INT64 | SUM(s.amount_cents) | money.txn_amount | unit=cents mislabeled_unit"
      - "cardholders | INT64 | COUNT(DISTINCT ca.bank_customer_ref) | metric.count"

  - name: web_to_branch_journeys
    writer: luis.carvajal
    cadence: weekly
    subject: web_analytics
    trap: F13
    desc: >-
      Attempt to link web sessions to customers by joining GA4 user_id straight
      to cif_number. user_id is SHA-256(olb_user_id), so this matches nothing.
      Runs weekly; returns zero rows; nobody has noticed.
    from: |
      ref(stg_ga4__events) e
      JOIN ref(dim_customer) c ON c.cif_number = e.user_id
    group_by: all
    columns:
      - "event_date | DATE | e.event_date | date.day"
      - "segment | STRING | c.segment | customer.segment"
      - "sessions | INT64 | COUNT(DISTINCT e.ga_session_id) | metric.count"
