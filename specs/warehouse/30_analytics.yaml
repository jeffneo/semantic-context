dataset: sbx_cx_ops
defaults: {materialized: ctas, writer: jerome.baptiste, refresh: manual}
tables:
  - name: cc_site_scorecard_2026
    subject: cc_performance
    desc: >-
      CC = contact center. Hand-built site scorecard - a duplicate of
      agg_site_monthly's logic, maintained separately.
    from: |
      ref(fct_calls) c
      JOIN ref(dim_cc_site) s ON s.site_id = c.site_id
    where: c.conversation_date >= '2026-01-01'
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(c.conversation_date, MONTH) | date.month"
      - "site_name | STRING | s.site_name"
      - "contacts | INT64 | COUNT(*) | metric.count"
      - "closure_calls | INT64 | COUNTIF(c.is_account_closure_call) | metric.count"
      - "avg_handle_sec | FLOAT64 | AVG(c.handle_sec) | metric.duration | unit=sec"

  - name: cc_closure_calls_apr_may
    subject: calls
    copy_of: dw_contact_center.fct_calls
    where: s.wrapup_code_name IN ('ACCT_MAINT', 'ACCT_CLOSE') AND s.conversation_date BETWEEN '2026-04-01' AND '2026-06-30'
    writer: hannah.sorensen
    created: 2026-06-09
    desc: Pulled to investigate the closure-code change on 2026-06-02.

  - name: cdr_history_rollup
    subject: cc_performance
    cadence: weekly
    writer: carla.mendoza
    planted: F09
    desc: >-
      Monthly rollup over ALL Avaya shards with no _TABLE_SUFFIX filter - a
      full scan of 33 shards every time it is refreshed.
    from: ref(contact_center_legacy.cdr_) c
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(DATE(c.CALL_START_DTTM), MONTH) | date.month"
      - "site_id | STRING | c.SITE_CD | cc_site.id"
      - "calls | INT64 | COUNT(*) | metric.count"
      - "handled | INT64 | COUNTIF(c.ABANDON_FLG = 'N') | metric.count"
      - "avg_talk_sec | FLOAT64 | AVG(c.TALK_SEC) | metric.duration | unit=sec"
