dataset: sbx_risk
defaults: {materialized: ctas, writer: samuel.achterberg, refresh: manual}
tables:
  - name: kyc_review_extract
    subject: aml_parties
    status: stale
    copy_of: aml_kyc.party
    drop: [dob]
    created: 2025-08-14
    writer: mei-lin.zhou
    planted: F08
    desc: >-
      A copy of the RESTRICTED AML party table - raw tax_id included - made
      into the risk sandbox, which marketing and data science can also read.

  - name: dlq_roll_rates_2026
    subject: delinquency
    desc: Monthly delinquency by bucket.
    from: ref(fct_delinquency_daily) d
    where: d.snapshot_date >= '2026-01-01'
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(d.snapshot_date, MONTH) | date.month"
      - "bucket | STRING | d.bucket"
      - "loans | INT64 | COUNT(DISTINCT d.account_key) | metric.count"
      - "past_due_amount | NUMERIC | SUM(d.past_due_amount) | money.balance | unit=usd"

  - name: bureau_fico_migration
    subject: credit_bureau
    writer: mei-lin.zhou
    desc: FICO band migration month over month.
    from: ref(fct_bureau_monthly) b
    group_by: all
    columns:
      - "archive_month | DATE | b.archive_month | date.month"
      - "fico_band | STRING | CASE WHEN b.fico_08 >= 740 THEN '740+' WHEN b.fico_08 >= 670 THEN '670-739' WHEN b.fico_08 >= 580 THEN '580-669' ELSE '<580' END"
      - "customers | INT64 | COUNT(*) | metric.count"

  - name: acct_bal_legacy_recon
    subject: balances
    writer: deepak.venkataraman
    desc: Reconciles legacy ACCT_DLY_BAL to fct_daily_account_balances via raw ACCT_NO.
    from: |
      ref(legacy_edw.ACCT_DLY_BAL) l
      JOIN ref(core_banking_cdc.ACCOUNT) a ON a.ACCT_NO = l.ACCT_NBR
      JOIN ref(fct_daily_account_balances) f ON f.core_account_id = a.ACCT_ID AND f.balance_date = l.BAL_DT
    columns:
      - "balance_date | DATE | l.BAL_DT | date.day"
      - "core_account_id | INT64 | a.ACCT_ID | deposit_account.id"
      - "legacy_balance | NUMERIC | l.LDGR_BAL_AMT | money.balance | unit=usd"
      - "dw_balance | NUMERIC | f.ledger_balance | money.balance | unit=usd"
      - "diff | NUMERIC | l.LDGR_BAL_AMT - f.ledger_balance | money.balance | unit=usd"
