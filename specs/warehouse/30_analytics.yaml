dataset: sbx_fraud
defaults: {materialized: ctas, writer: olumide.bankole, refresh: manual}
tables:
  - name: ato_signals_login
    subject: olb_logins
    writer: rachel.kim
    desc: Account-takeover signals per user per day.
    from: ref(fct_digital_logins) l
    group_by: all
    columns:
      - "olb_user_id | STRING | l.olb_user_id | customer.olb_user_id"
      - "event_date | DATE | l.event_date | date.day"
      - "failed_logins | INT64 | COUNTIF(NOT l.is_success) | metric.count"
      - "distinct_devices | INT64 | COUNT(DISTINCT l.device_id) | metric.count"
      - "distinct_countries | INT64 | COUNT(DISTINCT l.geo_country) | metric.count"

  - name: p2p_scam_cases_2026
    subject: fraud_cases
    copy_of: dw_risk.fct_fraud_alerts
    where: s.fraud_type = 'P2P_SCAM' AND s.alert_date >= '2026-01-01'
    desc: Confirmed P2P scam alerts this year.

  - name: bust_out_candidates
    subject: card_accounts
    trap: F03
    desc: >-
      Customers whose card and deposit accounts both look risky - joined on
      account_id, which is a DIFFERENT id space in the card processor. The
      integer ranges overlap, so it returns plausible-looking garbage.
    from: |
      ref(stg_cards__card_account) ca
      JOIN ref(stg_core__account) a ON a.account_id = ca.account_id
    where: ca.delinquency_bucket IS NOT NULL
    columns:
      - "account_id | INT64 | ca.account_id | card_account.id"
      - "card_status | STRING | ca.status"
      - "card_balance | NUMERIC | ca.current_balance | money.balance | unit=usd"
      - "deposit_status | STRING | a.account_status_code"
      - "deposit_open_date | DATE | a.open_date"
