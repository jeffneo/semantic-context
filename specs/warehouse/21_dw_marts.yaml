dataset: dw_finance
defaults: {materialized: table, writer: dbt-prod, refresh: "dbt nightly 02:00"}
tables:
  - name: dim_cost_center
    subject: cost_centers
    desc: Cost centers.
    grain: cost_center_id
    from: ref(stg_gl__cost_center) c
    columns:
      - "cost_center_id | STRING | c.cost_center_id | finance.cost_center_id | pk"
      - "cost_center_name | STRING | c.cost_center_name"
      - "department_code | STRING | c.department_code"
      - "region | STRING | c.region"
      - "is_active | BOOL | c.is_active"
      - "owner_worker_id | STRING | c.owner_worker_id | employee.id"

  - name: fct_gl_monthly
    subject: general_ledger
    desc: GL net amount by month, account and cost center.
    grain: month_start, gl_account_code, cost_center_id
    partition: month_start
    from: |
      ref(stg_gl__journal_line) j
      JOIN ref(stg_gl__gl_account) g ON g.gl_account_code = j.gl_account_code
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(j.accounting_date, MONTH) | date.month"
      - "period_name | STRING | j.period_name"
      - "gl_account_code | STRING | j.gl_account_code | gl.account_code"
      - "account_type | STRING | g.account_type"
      - "cost_center_id | STRING | j.cost_center_id | finance.cost_center_id"
      - "net_amount | NUMERIC | SUM(j.entered_dr - j.entered_cr) | money.gl_amount | unit=usd"

  - name: fct_fee_income_monthly
    subject: revenue
    desc: Fee income by month, product and fee type.
    grain: month_start, product_code, fee_type
    from: ref(fct_fees) f
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(f.assessed_date, MONTH) | date.month"
      - "product_code | STRING | f.product_code | product.code"
      - "fee_type | STRING | f.fee_type"
      - "gross_fees | NUMERIC | SUM(f.fee_amount) | money.fee | unit=usd"
      - "waived_fees | NUMERIC | SUM(IF(f.is_waived, f.fee_amount, 0)) | money.fee | unit=usd"
      - "net_fees | NUMERIC | SUM(f.net_fee) | money.revenue | unit=usd"

  - name: fct_customer_profitability_monthly
    subject: profitability
    desc: >-
      Customer x month revenue estimate: fee revenue, card interchange, and
      an FTP-based deposit margin (2.1% annualized - finance's assumption).
    grain: customer_key, month_start
    with:
      fees: |
        SELECT f.customer_key, DATE_TRUNC(f.assessed_date, MONTH) AS month_start, SUM(f.net_fee) AS fee_revenue
        FROM ref(fct_fees) f
        GROUP BY 1, 2
      ic: |
        SELECT t.customer_key, DATE_TRUNC(t.post_date, MONTH) AS month_start, SUM(t.interchange) AS interchange_revenue
        FROM ref(fct_card_transactions) t
        GROUP BY 1, 2
    from: |
      ref(customer_monthly_summary) s
      LEFT JOIN fees ON fees.customer_key = s.customer_key AND fees.month_start = s.month_start
      LEFT JOIN ic ON ic.customer_key = s.customer_key AND ic.month_start = s.month_start
    columns:
      - "customer_key | INT64 | s.customer_key | customer.key"
      - "month_start | DATE | s.month_start | date.month"
      - "avg_balance | NUMERIC | s.avg_daily_total_balance | money.balance | unit=usd"
      - "fee_revenue | NUMERIC | COALESCE(fees.fee_revenue, 0) | money.revenue | unit=usd"
      - "interchange_revenue | NUMERIC | COALESCE(ic.interchange_revenue, 0) | money.revenue | unit=usd"
      - "deposit_margin | NUMERIC | s.avg_daily_total_balance * 0.021 / 12 | money.revenue | unit=usd"
      - "total_revenue | NUMERIC | COALESCE(fees.fee_revenue, 0) + COALESCE(ic.interchange_revenue, 0) + s.avg_daily_total_balance * 0.021 / 12 | money.revenue | unit=usd"
---
