# =============================================================================
# fennmoor-dw: domain marts and ML
# =============================================================================
# The notebook's test question has a direct answer here:
#   dw_contact_center.rpt_site_cost_per_contact
#     <- agg_site_monthly (closure calls per site, from fct_calls)
#     <- fct_cc_site_cost_monthly (GL expense by the site's cost center)
# Correct site cost uses the GL only. vendor_invoice is AP detail that is
# ALREADY in the GL (source = 'AP'); adding it again double-counts the BPO.
# =============================================================================

dataset: dw_customer
defaults: {materialized: table, writer: dbt-prod, refresh: "dbt nightly 02:00"}
tables:
  - name: customer_360
    subject: customer_analytics
    desc: >-
      One wide row per customer: holdings, balances, card spend, contact
      history, digital activity and churn risk. The most-copied table in the
      estate - see the sandboxes.
    grain: customer_key
    bq_description: Customer 360. Refreshed nightly. Churn from ml_scores.churn_score_v3.
    notes: Read churn_score_v2 until the 2026-05-15 cutover; the spec shows the post-cutover state.
    cluster: [customer_key]
    with:
      holdings: |
        SELECT a.customer_key,
               COUNTIF(a.account_family = 'DEPOSIT' AND a.is_open) AS open_deposit_accounts,
               COUNTIF(a.account_family = 'CARD' AND a.is_open) AS open_card_accounts,
               COUNTIF(a.account_family = 'LOAN' AND a.is_open) AS open_loans,
               MIN(a.open_date) AS first_account_open_date
        FROM ref(dim_account) a
        GROUP BY a.customer_key
      bal: |
        SELECT b.customer_key, SUM(b.ledger_balance) AS total_deposit_balance
        FROM ref(fct_daily_account_balances) b
        WHERE b.balance_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
        GROUP BY b.customer_key
      spend: |
        SELECT t.customer_key, SUM(IF(t.is_purchase, t.amount, 0)) AS card_spend_90d,
               COUNT(*) AS card_txn_count_90d
        FROM ref(fct_card_transactions) t
        WHERE t.post_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
        GROUP BY t.customer_key
      contacts: |
        SELECT fc.customer_key, COUNT(*) AS contacts_90d,
               COUNTIF(fc.is_account_closure_call) AS closure_calls_90d
        FROM ref(fct_calls) fc
        WHERE fc.conversation_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
        GROUP BY fc.customer_key
      web: |
        SELECT ws.customer_key, COUNT(*) AS web_sessions_30d
        FROM ref(fct_web_sessions) ws
        WHERE ws.session_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
        GROUP BY ws.customer_key
    from: |
      ref(dim_customer) c
      LEFT JOIN holdings h ON h.customer_key = c.customer_key
      LEFT JOIN bal ON bal.customer_key = c.customer_key
      LEFT JOIN spend sp ON sp.customer_key = c.customer_key
      LEFT JOIN contacts ct ON ct.customer_key = c.customer_key
      LEFT JOIN web w ON w.customer_key = c.customer_key
      LEFT JOIN ref(churn_score_v3) ch ON ch.customer_key = c.customer_key AND ch.score_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
    columns:
      - "customer_key | INT64 | c.customer_key | customer.key | pk"
      - "cif_number | STRING | c.cif_number | customer.cif"
      - "full_name | STRING | c.full_name | pii.name | pii=name"
      - "primary_email | STRING | c.primary_email | pii.email | pii=email"
      - "segment | STRING | c.segment | customer.segment"
      - "tenure_months | INT64 | c.tenure_months"
      - "state_code | STRING | c.state_code | geo.state"
      - "is_digitally_enrolled | BOOL | c.is_digitally_enrolled"
      - "open_deposit_accounts | INT64 | COALESCE(h.open_deposit_accounts, 0)"
      - "open_card_accounts | INT64 | COALESCE(h.open_card_accounts, 0)"
      - "open_loans | INT64 | COALESCE(h.open_loans, 0)"
      - "product_count | INT64 | COALESCE(h.open_deposit_accounts, 0) + COALESCE(h.open_card_accounts, 0) + COALESCE(h.open_loans, 0)"
      - "first_account_open_date | DATE | h.first_account_open_date"
      - "total_deposit_balance | NUMERIC | COALESCE(bal.total_deposit_balance, 0) | money.balance | unit=usd"
      - "card_spend_90d | NUMERIC | COALESCE(sp.card_spend_90d, 0) | money.txn_amount | unit=usd"
      - "card_txn_count_90d | INT64 | COALESCE(sp.card_txn_count_90d, 0) | metric.count"
      - "contacts_90d | INT64 | COALESCE(ct.contacts_90d, 0) | metric.count"
      - "closure_calls_90d | INT64 | COALESCE(ct.closure_calls_90d, 0) | metric.count"
      - "web_sessions_30d | INT64 | COALESCE(w.web_sessions_30d, 0) | metric.count"
      - "churn_probability | FLOAT64 | ch.churn_probability | score.churn_probability"
      - "churn_risk_band | STRING | ch.risk_band"

  - name: customer_monthly_summary
    subject: customer_analytics
    materialized: incremental
    desc: Monthly average deposit balance per customer.
    grain: customer_key, month_start
    partition: month_start
    from: ref(fct_daily_account_balances) b
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(b.balance_date, MONTH) | date.month"
      - "customer_key | INT64 | b.customer_key | customer.key"
      - "avg_daily_total_balance | NUMERIC | SUM(b.ledger_balance) / COUNT(DISTINCT b.balance_date) | money.balance | unit=usd"
      - "max_daily_total_balance | NUMERIC | MAX(b.ledger_balance) | money.balance | unit=usd"
      - "accounts_with_balance | INT64 | COUNT(DISTINCT b.account_key) | metric.count"

  - name: customer_product_holdings
    subject: customer_analytics
    desc: Customer x product holdings, open and closed.
    grain: customer_key, product_code
    from: |
      ref(dim_account) a
      JOIN ref(dim_product) p ON p.product_code = a.product_code
    group_by: all
    columns:
      - "customer_key | INT64 | a.customer_key | customer.key"
      - "product_code | STRING | a.product_code | product.code"
      - "product_family | STRING | p.product_family"
      - "product_line | STRING | p.product_line"
      - "open_accounts | INT64 | COUNTIF(a.is_open) | metric.count"
      - "first_open_date | DATE | MIN(a.open_date)"
      - "last_close_date | DATE | MAX(a.close_date)"
---
dataset: dw_contact_center
defaults: {materialized: table, writer: dbt-prod, refresh: "dbt nightly 02:00"}
tables:
  - name: dim_cc_site
    subject: cc_sites
    desc: Contact-center sites with their finance cost center.
    grain: site_id
    from: |
      ref(stg_ref__contact_center_site) s
      LEFT JOIN ref(stg_gl__cost_center) cc ON cc.cost_center_id = s.cost_center_id
    columns:
      - "site_id | STRING | s.site_id | cc_site.id | pk"
      - "site_name | STRING | s.site_name"
      - "city | STRING | s.city"
      - "state | STRING | s.state | geo.state"
      - "operator | STRING | s.operator"
      - "is_outsourced | BOOL | s.is_outsourced"
      - "cost_center_id | STRING | s.cost_center_id | finance.cost_center_id"
      - "cost_center_name | STRING | cc.cost_center_name"
      - "seat_count | INT64 | s.seat_count"
      - "go_live_date | DATE | s.go_live_date"
      - "queue_prefix | STRING | s.genesys_queue_prefix"

  - name: dim_queue
    subject: queues
    desc: Genesys queues with the site parsed from the name prefix.
    grain: queue_id
    from: |
      ref(stg_genesys__queue) q
      LEFT JOIN ref(stg_ref__contact_center_site) s ON STARTS_WITH(q.name, s.genesys_queue_prefix)
    columns:
      - "queue_id | STRING | q.queue_id | queue.id | pk"
      - "queue_name | STRING | q.name"
      - "site_id | STRING | s.site_id | cc_site.id"
      - "line_of_business | STRING | REGEXP_EXTRACT(q.name, r'^[A-Z]+_(.*)$')"
      - "division_id | STRING | q.division_id | genesys.division_id"

  - name: dim_agent
    subject: agents
    desc: >-
      Agents. site_id comes from the agent's location - which is NOT always
      the site of the queue they answered (overflow routing). Labor cost sits
      with the agent's site, so that is the attribution fct_calls uses.
    grain: agent_user_id
    from: |
      ref(stg_genesys__user) u
      LEFT JOIN ref(stg_wd__worker) w ON w.worker_id = u.employee_id
    columns:
      - "agent_user_id | STRING | u.user_id | agent.genesys_user_id | pk"
      - "agent_name | STRING | u.name | pii.name | pii=name"
      - "employee_id | STRING | u.employee_id | employee.id"
      - "location_name | STRING | u.location_name"
      - "site_id | STRING | CASE WHEN STRPOS(u.location_name, 'Tulsa') > 0 THEN 'TUL' WHEN STRPOS(u.location_name, 'Spokane') > 0 THEN 'SPK' WHEN STRPOS(u.location_name, 'Manila') > 0 THEN 'MNL' END | cc_site.id"
      - "is_bpo | BOOL | u.employee_id IS NULL"
      - "hire_date | DATE | w.hire_date"
      - "tenure_months | INT64 | DATE_DIFF(CURRENT_DATE(), w.hire_date, MONTH)"
      - "job_profile | STRING | w.job_profile"
      - "manager_user_id | STRING | u.manager_id | agent.genesys_user_id"

  - name: fct_calls
    subject: calls
    materialized: incremental
    refresh: "dbt hourly incremental"
    desc: One row per contact since the Genesys go-live (2025-10-01).
    grain: conversation_id
    bq_description: Contacts (voice, chat, email). site_id = agent's site.
    partition: conversation_date
    cluster: [site_id, customer_key]
    rows: 7900000
    from: |
      ref(int_calls_enriched) c
      LEFT JOIN ref(dim_customer) cu ON cu.cif_number = c.cif_number
      LEFT JOIN ref(dim_agent) ag ON ag.agent_user_id = c.agent_user_id
    columns:
      - "conversation_id | STRING | c.conversation_id | call.conversation_id | pk"
      - "conversation_date | DATE | c.conversation_date | date.day"
      - "conversation_start | TIMESTAMP | c.conversation_start"
      - "media_type | STRING | c.media_type"
      - "direction | STRING | c.direction"
      - "customer_key | INT64 | cu.customer_key | customer.key"
      - "cif_number | STRING | c.cif_number | customer.cif"
      - "queue_id | STRING | c.queue_id | queue.id"
      - "queue_name | STRING | c.queue_name"
      - "queue_site_id | STRING | c.queue_site_id | cc_site.id"
      - "agent_user_id | STRING | c.agent_user_id | agent.genesys_user_id"
      - "agent_site_id | STRING | ag.site_id | cc_site.id"
      - "site_id | STRING | COALESCE(ag.site_id, c.queue_site_id) | cc_site.id"
      - "ivr_auth_result | STRING | c.ivr_auth_result"
      - "ivr_intent | STRING | c.ivr_intent"
      - "wrapup_code_name | STRING | c.wrapup_code_name | call.wrapup_code"
      - "is_account_closure_call | BOOL | c.is_account_closure_call"
      - "talk_sec | INT64 | c.talk_sec | metric.duration | unit=sec"
      - "hold_sec | INT64 | c.hold_sec | metric.duration | unit=sec"
      - "acw_sec | INT64 | c.acw_sec | metric.duration | unit=sec"
      - "handle_sec | INT64 | COALESCE(c.talk_sec, 0) + COALESCE(c.hold_sec, 0) + COALESCE(c.acw_sec, 0) | metric.duration | unit=sec"
      - "was_transferred | BOOL | c.was_transferred"
      - "is_abandoned | BOOL | c.is_abandoned"
      - "is_authenticated | BOOL | c.ivr_auth_result = 'AUTH_OK'"

  - name: fct_contacts_all
    subject: calls
    materialized: view
    desc: >-
      Genesys contacts unioned with Avaya CDR history for multi-year trends.
      Legacy dispositions CLSACCT/CLOSE map to closure calls.
    grain: contact_id
    with:
      g: |
        SELECT fc.conversation_id AS contact_id, 'GENESYS' AS source_system,
               fc.conversation_date, fc.site_id, fc.cif_number, fc.handle_sec,
               fc.is_account_closure_call, fc.is_abandoned
        FROM ref(fct_calls) fc
      l: |
        SELECT lc.legacy_call_id, 'AVAYA', lc.conversation_date, lc.site_id, lc.cif_number,
               lc.talk_sec + lc.hold_sec + lc.acw_sec,
               lc.disposition_code IN ('CLSACCT', 'CLOSE'), lc.is_abandoned
        FROM ref(int_calls_legacy_cdr) lc
      u: |
        SELECT * FROM g UNION ALL SELECT * FROM l
    from: u
    columns:
      - "contact_id | STRING | u.contact_id || pk"
      - "source_system | STRING | u.source_system"
      - "conversation_date | DATE | u.conversation_date | date.day"
      - "site_id | STRING | u.site_id | cc_site.id"
      - "cif_number | STRING | u.cif_number | customer.cif"
      - "handle_sec | INT64 | u.handle_sec | metric.duration | unit=sec"
      - "is_account_closure_call | BOOL | u.is_account_closure_call"
      - "is_abandoned | BOOL | u.is_abandoned"

  - name: fct_agent_daily
    subject: cc_performance
    desc: Agent x day productivity.
    grain: agent_user_id, conversation_date
    partition: conversation_date
    from: ref(fct_calls) c
    where: c.agent_user_id IS NOT NULL
    group_by: all
    columns:
      - "agent_user_id | STRING | c.agent_user_id | agent.genesys_user_id"
      - "conversation_date | DATE | c.conversation_date | date.day"
      - "site_id | STRING | ANY_VALUE(c.agent_site_id) | cc_site.id"
      - "contacts | INT64 | COUNT(*) | metric.count"
      - "handle_sec | INT64 | SUM(c.handle_sec) | metric.duration | unit=sec"
      - "avg_handle_sec | FLOAT64 | AVG(c.handle_sec) | metric.duration | unit=sec"
      - "closure_calls | INT64 | COUNTIF(c.is_account_closure_call) | metric.count"
      - "transfers | INT64 | COUNTIF(c.was_transferred) | metric.count"

  - name: fct_csat
    subject: surveys
    desc: Survey responses joined to the contact they rate.
    grain: survey_id
    from: |
      ref(stg_genesys__survey_response) s
      LEFT JOIN ref(fct_calls) c ON c.conversation_id = s.conversation_id
    columns:
      - "survey_id | STRING | s.survey_id || pk"
      - "conversation_id | STRING | s.conversation_id | call.conversation_id"
      - "conversation_date | DATE | c.conversation_date | date.day"
      - "site_id | STRING | c.site_id | cc_site.id"
      - "agent_user_id | STRING | s.agent_user_id | agent.genesys_user_id"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "csat_score | INT64 | s.csat_score | metric.csat"
      - "nps_score | INT64 | s.nps_score | metric.nps"
      - "is_promoter | BOOL | s.nps_score >= 9"
      - "is_detractor | BOOL | s.nps_score <= 6"

  - name: fct_cc_site_cost_monthly
    subject: cc_performance
    desc: >-
      Monthly cost per contact-center site: GL expense on the site's cost
      center, split by source. For the BPO site, vendor_expense is the
      Harbinger invoices as posted to the GL - do not add vendor_invoice again.
    grain: site_id, month_start
    with:
      gl: |
        SELECT DATE_TRUNC(j.accounting_date, MONTH) AS month_start, j.cost_center_id,
               SUM(j.entered_dr) - SUM(j.entered_cr) AS total_expense,
               SUM(IF(j.source = 'PAYROLL', j.entered_dr - j.entered_cr, 0)) AS payroll_expense,
               SUM(IF(j.source = 'AP', j.entered_dr - j.entered_cr, 0)) AS vendor_expense
        FROM ref(stg_gl__journal_line) j
        JOIN ref(stg_gl__gl_account) ga ON ga.gl_account_code = j.gl_account_code
        WHERE ga.account_type = 'EXPENSE'
        GROUP BY 1, 2
    from: |
      ref(stg_ref__contact_center_site) s
      JOIN gl ON gl.cost_center_id = s.cost_center_id
    columns:
      - "site_id | STRING | s.site_id | cc_site.id"
      - "month_start | DATE | gl.month_start | date.month"
      - "cost_center_id | STRING | s.cost_center_id | finance.cost_center_id"
      - "total_expense | NUMERIC | gl.total_expense | money.cost | unit=usd"
      - "payroll_expense | NUMERIC | gl.payroll_expense | money.cost | unit=usd"
      - "vendor_expense | NUMERIC | gl.vendor_expense | money.cost | unit=usd"
      - "other_expense | NUMERIC | gl.total_expense - gl.payroll_expense - gl.vendor_expense | money.cost | unit=usd"

  - name: agg_site_monthly
    subject: cc_performance
    desc: Site x month contact volumes, closure calls and handle time.
    grain: site_id, month_start
    from: ref(fct_calls) c
    group_by: all
    columns:
      - "month_start | DATE | DATE_TRUNC(c.conversation_date, MONTH) | date.month"
      - "site_id | STRING | c.site_id | cc_site.id"
      - "contacts | INT64 | COUNT(*) | metric.count"
      - "closure_calls | INT64 | COUNTIF(c.is_account_closure_call) | metric.count"
      - "unique_callers | INT64 | COUNT(DISTINCT c.customer_key) | metric.count"
      - "avg_handle_sec | FLOAT64 | AVG(c.handle_sec) | metric.duration | unit=sec"

  - name: rpt_site_cost_per_contact
    subject: cc_performance
    desc: >-
      Site x month: contacts, closure calls, cost, cost per contact. The
      direct answer to "which call centers see the most cancellations and
      what do they cost".
    grain: site_id, month_start
    from: |
      ref(agg_site_monthly) a
      LEFT JOIN ref(fct_cc_site_cost_monthly) k ON k.site_id = a.site_id AND k.month_start = a.month_start
      LEFT JOIN ref(dim_cc_site) s ON s.site_id = a.site_id
    columns:
      - "month_start | DATE | a.month_start | date.month"
      - "site_id | STRING | a.site_id | cc_site.id"
      - "site_name | STRING | s.site_name"
      - "is_outsourced | BOOL | s.is_outsourced"
      - "contacts | INT64 | a.contacts | metric.count"
      - "closure_calls | INT64 | a.closure_calls | metric.count"
      - "total_expense | NUMERIC | k.total_expense | money.cost | unit=usd"
      - "cost_per_contact | NUMERIC | SAFE_DIVIDE(k.total_expense, a.contacts) | money.cost | unit=usd"
---
dataset: dw_digital
defaults: {materialized: table, writer: dbt-prod, refresh: "dbt nightly 02:00"}
tables:
  - name: fct_web_sessions
    subject: web_analytics
    materialized: incremental
    desc: >-
      GA4 sessions resolved to customers via online_user.ga4_user_id. Only
      logged-in sessions resolve; the rest keep only user_pseudo_id.
    grain: session_key
    partition: session_date
    cluster: [customer_key]
    from: |
      ref(int_digital_sessions) s
      LEFT JOIN ref(stg_olb__online_user) u ON u.ga4_user_id = s.ga4_user_id
      LEFT JOIN ref(dim_customer) c ON c.cif_number = u.cif_number
    columns:
      - "session_key | STRING | s.session_key | web.session_id | pk"
      - "session_date | DATE | s.session_date | date.day"
      - "session_start | TIMESTAMP | s.session_start"
      - "user_pseudo_id | STRING | s.user_pseudo_id | customer.ga4_pseudo_id"
      - "ga4_user_id | STRING | s.ga4_user_id | customer.ga4_user_id"
      - "olb_user_id | STRING | u.olb_user_id | customer.olb_user_id"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "is_logged_in | BOOL | s.ga4_user_id IS NOT NULL"
      - "page_views | INT64 | s.page_views | metric.count"
      - "engaged_sec | FLOAT64 | s.engaged_sec | metric.duration | unit=sec"
      - "landing_page | STRING | s.landing_page"
      - "traffic_medium | STRING | s.traffic_medium"
      - "campaign_name | STRING | s.campaign_name"
      - "device_category | STRING | s.device_category"
      - "started_application | BOOL | s.started_application"
      - "submitted_application | BOOL | s.submitted_application"
      - "visited_help | BOOL | s.visited_help"

  - name: fct_app_sessions
    subject: app_analytics
    materialized: incremental
    desc: Amplitude app sessions resolved to CIF via online_user.
    grain: app_session_key
    partition: session_date
    from: |
      ref(stg_amp__events) e
      LEFT JOIN ref(stg_olb__online_user) u ON u.olb_user_id = e.user_id
    where: e.session_id > 0
    group_by: all
    columns:
      - "app_session_key | STRING | CONCAT(CAST(e.amplitude_id AS STRING), '-', CAST(e.session_id AS STRING)) || pk"
      - "session_date | DATE | MIN(e.event_date) | date.day"
      - "olb_user_id | STRING | ANY_VALUE(e.user_id) | customer.olb_user_id"
      - "cif_number | STRING | ANY_VALUE(u.cif_number) | customer.cif"
      - "events | INT64 | COUNT(*) | metric.count"
      - "screens | INT64 | COUNT(DISTINCT e.screen_name) | metric.count"
      - "platform | STRING | ANY_VALUE(e.platform)"
      - "app_version | STRING | ANY_VALUE(e.version_name)"

  - name: fct_digital_logins
    subject: olb_logins
    materialized: incremental
    desc: Login attempts with CIF. IP address deliberately not carried.
    grain: login_event_id
    partition: event_date
    from: |
      ref(stg_olb__login_event) l
      LEFT JOIN ref(stg_olb__online_user) u ON u.olb_user_id = l.olb_user_id
    columns:
      - "login_event_id | STRING | l.login_event_id || pk"
      - "event_date | DATE | DATE(l.event_ts, 'America/Chicago') | date.day"
      - "event_ts | TIMESTAMP | l.event_ts"
      - "olb_user_id | STRING | l.olb_user_id | customer.olb_user_id"
      - "cif_number | STRING | u.cif_number | customer.cif"
      - "channel | STRING | l.channel"
      - "result | STRING | l.result"
      - "is_success | BOOL | l.result = 'SUCCESS'"
      - "risk_score | INT64 | l.risk_score | score.fraud"
      - "device_id | STRING | l.device_id | device.id"
      - "geo_country | STRING | l.geo_country"

  - name: fct_account_opening_funnel
    subject: digital_funnels
    desc: Daily web account-opening funnel by traffic source and device.
    grain: session_date, traffic_medium, campaign_name, device_category
    from: ref(fct_web_sessions) s
    group_by: all
    columns:
      - "session_date | DATE | s.session_date | date.day"
      - "traffic_medium | STRING | s.traffic_medium"
      - "campaign_name | STRING | s.campaign_name"
      - "device_category | STRING | s.device_category"
      - "sessions | INT64 | COUNT(*) | metric.count"
      - "started | INT64 | COUNTIF(s.started_application) | metric.count"
      - "submitted | INT64 | COUNTIF(s.submitted_application) | metric.count"
      - "conversion_rate | FLOAT64 | SAFE_DIVIDE(COUNTIF(s.submitted_application), COUNTIF(s.started_application))"

  - name: fct_p2p_transfers
    subject: p2p
    materialized: incremental
    desc: Zelle transfers with CIF.
    grain: transfer_id
    partition: initiated_date
    from: |
      ref(stg_olb__p2p_transfer) p
      LEFT JOIN ref(stg_olb__online_user) u ON u.olb_user_id = p.olb_user_id
    columns:
      - "transfer_id | STRING | p.transfer_id || pk"
      - "initiated_date | DATE | DATE(p.initiated_at, 'America/Chicago') | date.day"
      - "olb_user_id | STRING | p.olb_user_id | customer.olb_user_id"
      - "cif_number | STRING | u.cif_number | customer.cif"
      - "core_account_id | INT64 | p.from_account_id | deposit_account.id"
      - "direction | STRING | p.direction"
      - "amount | NUMERIC | p.amount | money.txn_amount | unit=usd"
      - "status | STRING | p.status"
      - "fraud_hold | BOOL | p.fraud_hold"
---
dataset: dw_marketing
defaults: {materialized: table, writer: dbt-prod, refresh: "dbt nightly 02:00"}
tables:
  - name: dim_campaign
    subject: campaigns
    desc: Braze campaigns with the matching Salesforce campaign and cost.
    grain: campaign_id
    from: |
      ref(stg_braze__campaign) b
      LEFT JOIN ref(stg_sf__campaign) s ON s.braze_campaign_id = b.campaign_id
    columns:
      - "campaign_id | STRING | b.campaign_id | campaign.id | pk"
      - "campaign_name | STRING | b.name"
      - "channels | ARRAY<STRING> | b.channels"
      - "tags | ARRAY<STRING> | b.tags"
      - "first_sent | TIMESTAMP | b.first_sent"
      - "last_sent | TIMESTAMP | b.last_sent"
      - "is_archived | BOOL | b.archived"
      - "sf_campaign_id | STRING | s.campaign_id | crm.campaign_id"
      - "budgeted_cost | NUMERIC | s.budgeted_cost | money.cost | unit=usd"
      - "actual_cost | NUMERIC | s.actual_cost | money.cost | unit=usd"

  - name: fct_campaign_sends
    subject: message_delivery
    materialized: incremental
    desc: Message sends with customer key.
    grain: message_send_id
    partition: sent_date
    cluster: [campaign_id, customer_key]
    from: |
      ref(stg_braze__message_send) m
      LEFT JOIN ref(dim_customer) c ON c.cif_number = m.external_user_id
    columns:
      - "message_send_id | STRING | m.message_send_id | message.send_id | pk"
      - "sent_date | DATE | DATE(m.sent_at, 'America/Chicago') | date.day"
      - "sent_at | TIMESTAMP | m.sent_at"
      - "cif_number | STRING | m.external_user_id | customer.cif"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "campaign_id | STRING | m.campaign_id | campaign.id"
      - "canvas_id | STRING | m.canvas_id | canvas.id"
      - "channel | STRING | m.channel"
      - "dispatch_id | STRING | m.dispatch_id | braze.dispatch_id"

  - name: fct_campaign_engagement
    subject: engagement
    materialized: incremental
    desc: Email engagement per campaign dispatch per customer.
    grain: campaign_id, dispatch_id, cif_number
    partition: event_date
    from: ref(stg_braze__email_event) e
    group_by: all
    columns:
      - "campaign_id | STRING | e.campaign_id | campaign.id"
      - "dispatch_id | STRING | e.dispatch_id | braze.dispatch_id"
      - "cif_number | STRING | e.external_user_id | customer.cif"
      - "event_date | DATE | MIN(DATE(e.event_time, 'America/Chicago')) | date.day"
      - "delivered | BOOL | LOGICAL_OR(e.event_type = 'delivery')"
      - "opened | BOOL | LOGICAL_OR(e.event_type = 'open')"
      - "clicked | BOOL | LOGICAL_OR(e.event_type = 'click')"
      - "unsubscribed | BOOL | LOGICAL_OR(e.event_type = 'unsubscribe')"
      - "bounced | BOOL | LOGICAL_OR(e.event_type = 'bounce')"

  - name: fct_campaign_attribution
    subject: attribution
    desc: Conversions attributed to the last send of the same campaign.
    grain: conversion_id
    from: |
      ref(stg_braze__conversion) cv
      JOIN ref(fct_campaign_sends) s
        ON s.cif_number = cv.external_user_id AND s.campaign_id = cv.campaign_id AND s.sent_at <= cv.event_time
    qualify: ROW_NUMBER() OVER (PARTITION BY cv.conversion_id ORDER BY s.sent_at DESC) = 1
    columns:
      - "conversion_id | STRING | cv.conversion_id || pk"
      - "conversion_at | TIMESTAMP | cv.event_time"
      - "cif_number | STRING | cv.external_user_id | customer.cif"
      - "customer_key | INT64 | s.customer_key | customer.key"
      - "campaign_id | STRING | cv.campaign_id | campaign.id"
      - "conversion_behavior | STRING | cv.conversion_behavior"
      - "attributed_send_id | STRING | s.message_send_id | message.send_id"
      - "hours_since_send | INT64 | TIMESTAMP_DIFF(cv.event_time, s.sent_at, HOUR) | metric.duration"
