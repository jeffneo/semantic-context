dataset: dw_risk
defaults: {materialized: table, writer: dbt-prod, refresh: "dbt nightly 02:00"}
tables:
  - name: fct_credit_applications
    subject: loan_applications
    desc: Applications with their final underwriting decision.
    grain: application_id
    partition: submitted_date
    with:
      d: |
        SELECT x.application_id, x.outcome, x.approved_amount, x.approved_apr
        FROM ref(stg_los__decision) x
        QUALIFY ROW_NUMBER() OVER (PARTITION BY x.application_id ORDER BY x.decision_seq DESC) = 1
    from: |
      ref(stg_los__application) a
      LEFT JOIN d ON d.application_id = a.application_id
      LEFT JOIN ref(dim_customer) c ON c.cif_number = a.applicant_cif_number
    columns:
      - "application_id | STRING | a.application_id | loan.application_id | pk"
      - "submitted_date | DATE | DATE(a.submitted_at, 'America/Chicago') | date.day"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "applicant_cif_number | STRING | a.applicant_cif_number | customer.cif"
      - "product_code | STRING | a.product_code | product.code"
      - "channel | STRING | a.channel"
      - "requested_amount | NUMERIC | a.requested_amount | money.loan_principal | unit=usd"
      - "final_outcome | STRING | d.outcome"
      - "approved_amount | NUMERIC | d.approved_amount | money.loan_principal | unit=usd"
      - "approved_apr | NUMERIC | d.approved_apr || unit=pct"
      - "credit_score_at_app | INT64 | a.credit_score_at_app | score.credit"
      - "branch_id | INT64 | a.branch_number | branch.id"
      - "offer_code | STRING | a.offer_code"

  - name: fct_delinquency_daily
    subject: delinquency
    materialized: incremental
    desc: Daily loan delinquency.
    grain: snapshot_date, account_key
    partition: snapshot_date
    from: |
      ref(stg_los__delinquency_snapshot) d
      JOIN ref(dim_account) a ON a.loan_number = d.loan_number
    columns:
      - "snapshot_date | DATE | d.snapshot_date | date.day"
      - "account_key | INT64 | a.account_key | account.key"
      - "customer_key | INT64 | a.customer_key | customer.key"
      - "loan_number | STRING | d.loan_number | loan.id"
      - "product_code | STRING | a.product_code | product.code"
      - "dpd | INT64 | d.dpd"
      - "bucket | STRING | d.bucket"
      - "past_due_amount | NUMERIC | d.past_due_amount | money.balance | unit=usd"

  - name: fct_loan_payments
    subject: loan_payments
    materialized: incremental
    desc: Loan payments with account key.
    grain: payment_id
    partition: payment_date
    from: |
      ref(stg_los__loan_payment) p
      LEFT JOIN ref(dim_account) a ON a.loan_number = p.loan_number
    columns:
      - "payment_id | STRING | p.payment_id || pk"
      - "payment_date | DATE | p.payment_date | date.day"
      - "account_key | INT64 | a.account_key | account.key"
      - "loan_number | STRING | p.loan_number | loan.id"
      - "amount | NUMERIC | p.amount | money.txn_amount | unit=usd"
      - "principal | NUMERIC | p.principal_portion | money.loan_principal | unit=usd"
      - "interest | NUMERIC | p.interest_portion | money.interest | unit=usd"
      - "fee | NUMERIC | p.fee_portion | money.fee | unit=usd"
      - "is_late | BOOL | p.is_late"
      - "is_returned | BOOL | p.returned_flag"

  - name: fct_fraud_alerts
    subject: fraud_alerts
    materialized: incremental
    desc: Fraud alerts with case outcome.
    grain: alert_id
    partition: alert_date
    from: |
      ref(stg_fraud__alert) a
      LEFT JOIN ref(stg_fraud__case_alert_link) l ON l.alert_id = a.alert_id
      LEFT JOIN ref(stg_fraud__fraud_case) fc ON fc.case_id = l.case_id
      LEFT JOIN ref(dim_customer) c ON c.cif_number = a.cif_number
    columns:
      - "alert_id | STRING | a.alert_id | fraud.alert_id | pk"
      - "alert_date | DATE | DATE(a.alert_ts, 'America/Chicago') | date.day"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "cif_number | STRING | a.cif_number | customer.cif"
      - "entity_type | STRING | a.entity_type"
      - "rule_id | STRING | a.rule_id | fraud.rule_id"
      - "model_score | INT64 | a.model_score | score.fraud"
      - "channel | STRING | a.channel"
      - "amount | NUMERIC | a.amount | money.txn_amount | unit=usd"
      - "disposition | STRING | a.disposition"
      - "case_id | STRING | l.case_id | fraud.case_id"
      - "is_confirmed_fraud | BOOL | COALESCE(fc.confirmed_fraud, FALSE)"
      - "fraud_type | STRING | fc.fraud_type"
      - "loss_amount | NUMERIC | fc.total_loss_amount | money.cost | unit=usd"

  - name: fct_bureau_monthly
    subject: credit_bureau
    materialized: incremental
    desc: Monthly bureau attributes by customer. SSN hash dropped.
    grain: archive_month, customer_key
    partition: archive_month
    from: |
      ref(stg_bureau__consumer_attributes_monthly) b
      LEFT JOIN ref(dim_customer) c ON c.cif_number = b.cif_number
    columns:
      - "archive_month | DATE | b.archive_date | date.month"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "fico_08 | INT64 | b.fico_08 | score.credit"
      - "vantage_4 | INT64 | b.vantage_4 | score.credit"
      - "utilization_pct | NUMERIC | b.utilization_pct || unit=pct"
      - "total_revolving_balance | NUMERIC | b.total_revolving_balance | money.balance | unit=usd"
      - "num_delinquent_30_24m | INT64 | b.num_delinquent_30_24m | metric.count"
      - "estimated_income | NUMERIC | b.estimated_income | money.income | unit=usd"
