dataset: ml_features
defaults: {materialized: incremental, writer: dbt-prod, refresh: "dbt nightly 03:00"}
tables:
  - name: feat_customer_daily
    subject: ml_features
    desc: Daily customer feature snapshot for the churn model.
    grain: customer_key, as_of_date
    partition: as_of_date
    with:
      bal: |
        SELECT b.customer_key, AVG(b.ledger_balance) AS avg_balance_30d
        FROM ref(fct_daily_account_balances) b
        WHERE b.balance_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
        GROUP BY b.customer_key
      lg: |
        SELECT fl.cif_number, COUNTIF(fl.is_success) AS logins_30d, COUNTIF(NOT fl.is_success) AS failed_logins_30d
        FROM ref(fct_digital_logins) fl
        WHERE fl.event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
        GROUP BY fl.cif_number
      cl: |
        SELECT fc.customer_key, COUNT(*) AS contacts_90d, COUNTIF(fc.is_account_closure_call) AS closure_calls_90d
        FROM ref(fct_calls) fc
        WHERE fc.conversation_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
        GROUP BY fc.customer_key
      fe: |
        SELECT f.customer_key, COUNT(*) AS fee_count_90d, COUNTIF(f.is_waived) AS waived_fee_count_90d
        FROM ref(fct_fees) f
        WHERE f.assessed_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
        GROUP BY f.customer_key
    from: |
      ref(dim_customer) c
      LEFT JOIN bal ON bal.customer_key = c.customer_key
      LEFT JOIN lg ON lg.cif_number = c.cif_number
      LEFT JOIN cl ON cl.customer_key = c.customer_key
      LEFT JOIN fe ON fe.customer_key = c.customer_key
    columns:
      - "as_of_date | DATE | CURRENT_DATE() | date.day"
      - "customer_key | INT64 | c.customer_key | customer.key"
      - "tenure_months | INT64 | c.tenure_months"
      - "segment | STRING | c.segment | customer.segment"
      - "avg_balance_30d | NUMERIC | COALESCE(bal.avg_balance_30d, 0) | money.balance | unit=usd"
      - "logins_30d | INT64 | COALESCE(lg.logins_30d, 0) | metric.count"
      - "failed_logins_30d | INT64 | COALESCE(lg.failed_logins_30d, 0) | metric.count"
      - "contacts_90d | INT64 | COALESCE(cl.contacts_90d, 0) | metric.count"
      - "closure_calls_90d | INT64 | COALESCE(cl.closure_calls_90d, 0) | metric.count"
      - "fee_count_90d | INT64 | COALESCE(fe.fee_count_90d, 0) | metric.count"
      - "waived_fee_count_90d | INT64 | COALESCE(fe.waived_fee_count_90d, 0) | metric.count"

  - name: feat_card_velocity
    subject: ml_features
    status: write_only
    desc: >-
      Card velocity features for a batch fraud model that was retired when
      fraud moved to the vendor's real-time scoring. Still built nightly;
      nothing reads it (planted finding F07).
    grain: card_account_id
    from: ref(fct_card_transactions) t
    where: t.post_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
    group_by: all
    columns:
      - "card_account_id | INT64 | t.card_account_id | card_account.id"
      - "txn_count_1d | INT64 | COUNTIF(t.post_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)) | metric.count"
      - "txn_count_7d | INT64 | COUNT(*) | metric.count"
      - "amount_7d | NUMERIC | SUM(t.amount) | money.txn_amount | unit=usd"
      - "distinct_mcc_7d | INT64 | COUNT(DISTINCT t.mcc) | metric.count"
      - "foreign_txn_7d | INT64 | COUNTIF(t.is_foreign) | metric.count"
---
# Written by Vertex AI batch prediction, not SQL - `upstream` records the
# non-SQL lineage (what the scoring job reads).
dataset: ml_scores
defaults: {writer: vertex-scoring, refresh: "vertex nightly 04:00", upstream: [ml_features.feat_customer_daily]}
tables:
  - name: churn_score_v2
    subject: churn_models
    status: deprecated
    superseded_by: ml_scores.churn_score_v3
    desc: >-
      Churn model v2. Last written 2026-05-14. Still read by one Looker PDT
      and one analyst after the cutover (planted finding F11).
    grain: score_date, customer_key
    partition: score_date
    rows: 190000000
    columns:
      - "score_date | DATE || date.day | required"
      - "customer_key | INT64 || customer.key | required"
      - "cif_number | STRING || customer.cif"
      - "churn_score | FLOAT64 || score.churn_probability"
      - "model_version | STRING"

  - name: churn_score_v3
    subject: churn_models
    supersedes: ml_scores.churn_score_v2
    desc: Churn model v3 from 2026-05-15. Column renamed churn_score -> churn_probability.
    grain: score_date, customer_key
    partition: score_date
    cluster: [customer_key]
    rows: 100000000
    columns:
      - "score_date | DATE || date.day | required"
      - "customer_key | INT64 || customer.key | required"
      - "churn_probability | FLOAT64 || score.churn_probability"
      - "risk_band | STRING"
      - "top_reason_codes | ARRAY<STRING>"
      - "model_version | STRING"

  - name: next_best_offer
    subject: propensity_models
    desc: Top product offers per customer.
    grain: score_date, customer_key, rank
    partition: score_date
    rows: 300000000
    columns:
      - "score_date | DATE || date.day | required"
      - "customer_key | INT64 || customer.key | required"
      - "offer_product_code | STRING || product.code"
      - "propensity | FLOAT64 || score.product_propensity"
      - "rank | INT64"
