# =============================================================================
# Query-log simulator configuration (tools/simulate.py)
# =============================================================================
# Every behavioural assumption the simulator makes is here. Templates say WHAT
# each principal runs; this file says HOW OFTEN, WHEN, and HOW MESSILY.
# =============================================================================

seed: 20260401
timezone: America/Chicago
holidays: [2026-05-25, 2026-06-19]         # Memorial Day, Juneteenth (bank holidays in the window)

# Logical project -> project_number, as they appear in the log.
project_numbers:
  fennmoor-raw: 418273650912
  fennmoor-dw: 418273650988
  fennmoor-analytics: 418273651034
human_email_domain: fennmoorbank.com

# What actually runs, where it differs from a template's nominal cadence.
schedule_overrides:
  dq_monitor: {every: 24h, window: ["03:00", "05:30"]}   # Elementary configured daily in prod
  dbt_freshness: {every: 6h}
  looker_trigger: {every: 15m}

dbt:
  nightly_start: "02:00"
  seconds_per_level: 95          # DAG level spacing in the nightly run
  threads: 8
  failure_rate: 0.002

fivetran:
  # A sync only MERGEs a table that changed. Probability by table size.
  change_probability: {small: 0.08, medium: 0.45, large: 0.97}   # rows <1e5, <1e7, >=1e7

humans:
  # Mean ad-hoc queries per working day, per person, by team.
  queries_per_day:
    data_engineering: 12
    customer_analytics: 40
    marketing_analytics: 32
    risk_analytics: 28
    fraud_strategy: 34
    cx_ops: 18
    finance_fpa: 14
    digital_product: 30
    data_science: 36
    compliance: 10
  person_sigma: 0.55             # lognormal spread of individual activity
  affinity_sigma: 1.0            # how strongly each person prefers their favourite templates
  own_template_boost: 3.0        # templates written for a named person (`by`) are their habits
  pto_rate: 0.04                 # chance of a day off
  workday: ["08:00", "18:00"]
  session:
    queries_mean: 5              # queries per session (geometric)
    gap_median_sec: 90
    next_step: {rerun_same_text: 0.22, retweak_params: 0.43, switch_shape: 0.15, related_template: 0.12}
  errors:
    typo: 0.035                  # a mistyped column, followed by the fixed query
    access_denied: 0.004         # an attempt on a dataset the person cannot read
    resources_exceeded_full_scan: 0.08   # of executions of full-scan shapes
  comment_noise: 0.06            # a scratch comment added to the query text

looker:
  business_users: 160            # Looker-only users (branch managers, supervisors)
  analyst_share: 0.3             # of dashboard views that are by the explore's analysts
  cache_minutes: 60              # Looker's own result cache - a hit issues no BigQuery job
  weekend_factor: 0.1
  dashboard_views_per_day:
    contact_center: 55
    site_kpis: 12
    card_spend_by_mcc: 10
    customer_facts: 14
    churn_risk: 9
    digital_funnel: 12
    delinquency: 8
    branch_scorecard: 25
    campaigns: 16
  explore_queries_per_day:
    contact_center: 40
    card_transactions: 35
    customer_facts: 20
    churn_risk: 6
    digital_funnel: 8
    campaigns: 12
    site_kpis: 4
    card_spend_by_mcc: 3
    branch_scorecard: 5
    delinquency: 2

tableau:
  live_queries_per_day: 30

cost:
  history_days_default: 1095     # partitioned tables keep 3 years
  bytes_per_slot_ms: 25000       # ~25 MB per slot-second
  min_billed_bytes: 10485760     # 10 MB minimum per query
