# qlsc converse examples/fennmoor-bank/conversations/marketing-1.yaml
# A banker in marketing, preparing for and meeting a customer: the graph questions' customer 0001000025,
# by its key (the CIF number is an identifier marketing may not read).
title: Card offer for customer 8322097816940277129
as: marketing
messages:
  - user: I'm meeting customer 8322097816940277129 today. What do we hold for them?
    tools:
      - recall: Customer 8322097816940277129
  - agent: >-
      A mass-segment customer of 99 months with 17 accounts; 45 calls, and card and deposit activity
      every week of the last 90 days.
  - user: What did they spend on their cards last quarter, by merchant category?
    tools:
      - ask: Card spend by merchant category for the customer with customer_key 8322097816940277129, last quarter
  - agent: Their card spend last quarter, by merchant category, is above.
  - user: >-
      They'd rather hear from us by email than by phone, and they asked about a travel card. Their
      daughter Ana banks with a competitor.
    learned:
      - fact: {about: Customer 8322097816940277129, predicate: prefers contact channel, value: "email, not phone"}
      - fact: {about: Customer 8322097816940277129, predicate: interested in, value: a travel rewards card}
      - entity: {name: Ana, type: person, predicate: daughter of, about: Customer 8322097816940277129}
  - agent: "Noted: email only, and Ana. I'd offer the travel rewards card, by email."
    decided:
      - choice: offer a travel rewards card, by email
        rationale: They asked about a travel card, spend on travel, and prefer email.
        about: Customer 8322097816940277129
        based_on: [fact prefers contact channel, fact interested in, step ask]
        alternatives: [offer a cash-back card, no offer yet]
