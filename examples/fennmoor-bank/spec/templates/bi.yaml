# =============================================================================
# BI tools - Looker explores/dashboards and Tableau workbooks
# =============================================================================
# The SQL is generated by code (tools/templates.py) in each tool's real
# style. Looker's comes out as its own SQL:
#   - `view_field` aliases
#   - date filters as nested DATE_ADD(CURRENT_DATE('America/Chicago'), ...)
#   - positional GROUP BY and LIMIT 500
#   - the `-- Looker Query Context` comment
# Every Looker query runs as looker-prod; the human behind it appears only
# as user_id in that comment.
#
# explore keys:
#   view / from / joins   the explore's base view and joins, as Looker writes them
#   dimensions/measures   field -> SQL
#   filters               filter -> predicate (may use {{params}})
#   date_field            used for the "last N days" filter
#   date_optional         some explore sessions omit the date filter
#   unfiltered_finding    finding id to tag sessions that do (full scans)
#   tiles                 dashboard tiles (fixed shapes)
#   explore_shapes        sampled ad-hoc explore sessions
#   users                 analysts who explore it (dashboards are also
#                         viewed by many business users - by user_id only)
# =============================================================================

explores:
  contact_center:
    view: fct_calls
    from: fennmoor-dw.dw_contact_center.fct_calls
    joins:
      - "LEFT JOIN `fennmoor-dw.dw_contact_center.dim_cc_site`  AS dim_cc_site ON fct_calls.site_id = dim_cc_site.site_id"
      - "LEFT JOIN `fennmoor-dw.dw_contact_center.dim_agent`  AS dim_agent ON fct_calls.agent_user_id = dim_agent.agent_user_id"
    date_field: fct_calls.conversation_date
    default_days: 30
    users: [jerome.baptiste, hannah.sorensen, carla.mendoza]
    filter_params: {site: "choice:TUL|SPK|MNL"}
    dimensions:
      conversation_date: fct_calls.conversation_date
      conversation_week: DATE_TRUNC(fct_calls.conversation_date, WEEK(MONDAY))
      site_name: dim_cc_site.site_name
      is_outsourced: dim_cc_site.is_outsourced
      media_type: fct_calls.media_type
      wrapup: fct_calls.wrapup_code_name
      queue_name: fct_calls.queue_name
      agent_name: dim_agent.agent_name
      ivr_intent: fct_calls.ivr_intent
    measures:
      count: COUNT(DISTINCT fct_calls.conversation_id )
      closure_calls: COUNT(DISTINCT CASE WHEN fct_calls.is_account_closure_call THEN fct_calls.conversation_id ELSE NULL END)
      avg_handle_time: AVG(fct_calls.handle_sec )
      abandon_rate: SAFE_DIVIDE(COUNTIF(fct_calls.is_abandoned), COUNT(*))
      transfers: COUNTIF(fct_calls.was_transferred)
    filters:
      voice_only: (fct_calls.media_type ) = 'voice'
      one_site: (dim_cc_site.site_id ) = '{{site}}'
      closures_only: fct_calls.is_account_closure_call
    tiles:
      - {dims: [conversation_date], measures: [count, avg_handle_time], days: 30, weight: 6}
      - {dims: [site_name], measures: [count, closure_calls], days: 30, weight: 6}
      - {dims: [wrapup], measures: [count], days: 7, limit: 50, weight: 4}
      - {dims: [site_name, conversation_week], measures: [abandon_rate], days: 90, weight: 3}
    explore_shapes: 24

  site_kpis:
    view: site_monthly_kpis
    from: fennmoor-analytics.looker_scratch.LR_Q1Z7T4V9N2M5A_site_monthly_kpis
    date_field: site_monthly_kpis.month_start
    default_days: 365
    users: [jerome.baptiste, victor.almeida]
    dimensions:
      month_start: site_monthly_kpis.month_start
      site_name: site_monthly_kpis.site_name
      is_outsourced: site_monthly_kpis.is_outsourced
    measures:
      contacts: COALESCE(SUM(site_monthly_kpis.contacts ), 0)
      closure_calls: COALESCE(SUM(site_monthly_kpis.closure_calls ), 0)
      total_expense: COALESCE(SUM(site_monthly_kpis.total_expense ), 0)
      cost_per_contact: SAFE_DIVIDE(SUM(site_monthly_kpis.total_expense ), SUM(site_monthly_kpis.contacts ))
    tiles:
      - {dims: [month_start, site_name], measures: [contacts, closure_calls, cost_per_contact], days: 365, weight: 5}
      - {dims: [site_name], measures: [total_expense], days: 365, weight: 3}
    explore_shapes: 6

  card_transactions:
    view: fct_card_transactions
    from: fennmoor-dw.dw_core.fct_card_transactions
    joins:
      - "LEFT JOIN `fennmoor-dw.dw_core.dim_customer`  AS dim_customer ON fct_card_transactions.customer_key = dim_customer.customer_key"
    date_field: fct_card_transactions.post_date
    date_optional: true
    unfiltered_finding: F09
    users: [dana.whitfield, luis.carvajal, simone.okonkwo]
    dimensions:
      post_date: fct_card_transactions.post_date
      post_month: DATE_TRUNC(fct_card_transactions.post_date, MONTH)
      mcc_category_group: fct_card_transactions.mcc_category_group
      segment: dim_customer.segment
      merchant_name: fct_card_transactions.merchant_name
      is_foreign: fct_card_transactions.is_foreign
      txn_type: fct_card_transactions.txn_type
    measures:
      total_spend: COALESCE(SUM(CASE WHEN fct_card_transactions.is_purchase THEN fct_card_transactions.amount ELSE NULL END), 0)
      txn_count: COUNT(DISTINCT fct_card_transactions.settlement_id )
      cardholders: COUNT(DISTINCT fct_card_transactions.customer_key )
      interchange: COALESCE(SUM(fct_card_transactions.interchange ), 0)
    filters:
      purchases_only: (fct_card_transactions.txn_type ) = 'PURCH'
      affluent: (dim_customer.segment ) IN ('affluent', 'private')
    explore_shapes: 20

  card_spend_by_mcc:
    view: card_spend
    from: fennmoor-analytics.looker_scratch.LR_5T7Y9U1I3O5P7_card_spend_by_mcc
    date_field: card_spend.month_start
    default_days: 365
    users: [dana.whitfield, simone.okonkwo]
    dimensions:
      month_start: card_spend.month_start
      mcc_category_group: card_spend.mcc_category_group
    measures:
      spend: COALESCE(SUM(card_spend.spend ), 0)
      txn_count: COALESCE(SUM(card_spend.txn_count ), 0)
      active_accounts: COALESCE(SUM(card_spend.active_accounts ), 0)
    tiles:
      - {dims: [month_start, mcc_category_group], measures: [spend, txn_count], days: 365, weight: 5}
    explore_shapes: 4

  customer_facts:
    view: customer_facts
    from: fennmoor-analytics.looker_scratch.LR_6H0IZB3PQ4C6N_customer_facts
    users: [dana.whitfield, luis.carvajal, simone.okonkwo]
    dimensions:
      segment: customer_facts.segment
      state_code: customer_facts.state_code
      tenure_band: CASE WHEN customer_facts.tenure_months < 12 THEN '0-1y' WHEN customer_facts.tenure_months < 60 THEN '1-5y' ELSE '5y+' END
      is_digitally_enrolled: customer_facts.is_digitally_enrolled
      churn_risk_band: customer_facts.churn_risk_band
    measures:
      customers: COUNT(DISTINCT customer_facts.customer_key )
      total_deposits: COALESCE(SUM(customer_facts.total_deposit_balance ), 0)
      avg_products: AVG(customer_facts.product_count )
      avg_churn: AVG(customer_facts.churn_probability )
    filters:
      enrolled: customer_facts.is_digitally_enrolled
      high_value: (customer_facts.total_deposit_balance ) >= 100000
    tiles:
      - {dims: [segment], measures: [customers, total_deposits, avg_products], weight: 5}
      - {dims: [churn_risk_band], measures: [customers], weight: 3}
    explore_shapes: 16

  churn_risk:
    view: churn_explore
    from: fennmoor-analytics.looker_scratch.LR_8B3N0C5D2X7Z1_churn_explore
    date_field: churn_explore.score_date
    default_days: 7
    findings: [F11]
    users: [dana.whitfield, simone.okonkwo]
    dimensions:
      score_date: churn_explore.score_date
      segment: churn_explore.segment
      state_code: churn_explore.state_code
    measures:
      customers: COUNT(DISTINCT churn_explore.customer_key )
      avg_churn: AVG(churn_explore.churn_score )
      high_risk: COUNT(DISTINCT CASE WHEN churn_explore.churn_score >= 0.6 THEN churn_explore.customer_key ELSE NULL END)
    tiles:
      - {dims: [segment], measures: [customers, high_risk, avg_churn], days: 7, weight: 5}
      - {dims: [score_date], measures: [avg_churn], days: 90, weight: 2}
    explore_shapes: 6

  digital_funnel:
    view: digital_funnel
    from: fennmoor-analytics.looker_scratch.LR_3M6N9B2V5C8X1_digital_funnel_daily
    date_field: digital_funnel.session_date
    default_days: 30
    users: [dana.whitfield, luis.carvajal]
    dimensions:
      session_date: digital_funnel.session_date
      traffic_medium: digital_funnel.traffic_medium
      campaign_name: digital_funnel.campaign_name
      device_category: digital_funnel.device_category
    measures:
      sessions: COALESCE(SUM(digital_funnel.sessions ), 0)
      started: COALESCE(SUM(digital_funnel.started ), 0)
      submitted: COALESCE(SUM(digital_funnel.submitted ), 0)
      conversion: SAFE_DIVIDE(SUM(digital_funnel.submitted ), SUM(digital_funnel.started ))
    tiles:
      - {dims: [session_date], measures: [sessions, started, submitted], days: 30, weight: 4}
      - {dims: [traffic_medium], measures: [conversion], days: 30, weight: 3}
    explore_shapes: 10

  delinquency:
    view: delinquency_trend
    from: fennmoor-analytics.looker_scratch.LR_7F2G5H8J1K4L6_delinquency_trend
    date_field: delinquency_trend.snapshot_date
    default_days: 90
    dimensions:
      snapshot_date: delinquency_trend.snapshot_date
      bucket: delinquency_trend.bucket
    measures:
      loans: COALESCE(SUM(delinquency_trend.loans ), 0)
      past_due: COALESCE(SUM(delinquency_trend.past_due_amount ), 0)
    tiles:
      - {dims: [snapshot_date, bucket], measures: [loans, past_due], days: 90, weight: 4}
    explore_shapes: 3

  branch_scorecard:
    view: branch_scorecard
    from: fennmoor-analytics.looker_scratch.LR_9P2O5I8U1Y4T7_branch_scorecard
    date_field: branch_scorecard.month_start
    default_days: 365
    dimensions:
      month_start: branch_scorecard.month_start
      branch_name: branch_scorecard.branch_name
      region: branch_scorecard.region
    measures:
      txns: COALESCE(SUM(branch_scorecard.txn_count ), 0)
      deposits: COALESCE(SUM(branch_scorecard.deposit_amount ), 0)
    tiles:
      - {dims: [region, month_start], measures: [txns, deposits], days: 365, weight: 4}
      - {dims: [branch_name], measures: [deposits], days: 30, limit: 200, weight: 6}
    explore_shapes: 6

  campaigns:
    view: fct_campaign_engagement
    from: fennmoor-dw.dw_marketing.fct_campaign_engagement
    joins:
      - "LEFT JOIN `fennmoor-dw.dw_marketing.dim_campaign`  AS dim_campaign ON fct_campaign_engagement.campaign_id = dim_campaign.campaign_id"
    date_field: fct_campaign_engagement.event_date
    default_days: 30
    users: [dana.whitfield, luis.carvajal, simone.okonkwo]
    dimensions:
      campaign_name: dim_campaign.campaign_name
      event_date: fct_campaign_engagement.event_date
      event_week: DATE_TRUNC(fct_campaign_engagement.event_date, WEEK(MONDAY))
    measures:
      delivered: COUNTIF(fct_campaign_engagement.delivered)
      opens: COUNTIF(fct_campaign_engagement.opened)
      clicks: COUNTIF(fct_campaign_engagement.clicked)
      open_rate: SAFE_DIVIDE(COUNTIF(fct_campaign_engagement.opened), COUNTIF(fct_campaign_engagement.delivered))
      unsubscribes: COUNTIF(fct_campaign_engagement.unsubscribed)
    tiles:
      - {dims: [campaign_name], measures: [delivered, opens, clicks, open_rate], days: 30, limit: 100, weight: 5}
    explore_shapes: 10

# Tableau finance workbooks. `extract` generates Tableau's full-extract SELECT
# from the table's columns; `sql` is a live-connection query.
tableau:
  - id: extract.eom_bal_by_product
    extract: sbx_finance.eom_bal_by_product_tableau
    schedule: {cron: "0 7 * * *"}
    findings: [F05]
  - id: extract.gl_monthly
    extract: dw_finance.fct_gl_monthly
    schedule: {cron: "10 7 * * *"}
  - id: extract.site_cost
    extract: dw_contact_center.rpt_site_cost_per_contact
    schedule: {cron: "20 7 * * *"}
  - id: extract.fees_full
    extract: dw_core.fct_fees
    schedule: {cron: "0 3 * * *"}
    findings: [F09]
  - id: extract.profitability
    extract: dw_finance.fct_customer_profitability_monthly
    schedule: {cron: "30 3 * * *"}
  - id: live.gl_by_cost_center
    schedule: {weight: 4, cadence: dashboard}
    params: {period: "period:-3..-1"}
    sql: |
      SELECT `fct_gl_monthly`.`cost_center_id` AS `cost_center_id`,
        `fct_gl_monthly`.`account_type` AS `account_type`,
        SUM(`fct_gl_monthly`.`net_amount`) AS `sum_net_amount_ok`
      FROM `fennmoor-dw`.`dw_finance`.`fct_gl_monthly` `fct_gl_monthly`
      WHERE (`fct_gl_monthly`.`period_name` = '{{period}}')
      GROUP BY 1,
        2
  - id: live.fee_income_trend
    schedule: {weight: 3, cadence: dashboard}
    sql: |
      SELECT `fct_fee_income_monthly`.`month_start` AS `month_start`,
        `fct_fee_income_monthly`.`fee_type` AS `fee_type`,
        SUM(`fct_fee_income_monthly`.`net_fees`) AS `sum_net_fees_ok`,
        SUM(`fct_fee_income_monthly`.`waived_fees`) AS `sum_waived_fees_ok`
      FROM `fennmoor-dw`.`dw_finance`.`fct_fee_income_monthly` `fct_fee_income_monthly`
      GROUP BY 1,
        2
