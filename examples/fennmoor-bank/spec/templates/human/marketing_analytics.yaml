# Marketing analytics: moderate SQL, Looker for dashboards, the console for
# everything else. Runs its own churn model (F10), trusts a cents column
# labelled _usd (F12), and reads raw GA4.
team: marketing_analytics
templates:
  - id: mk.campaign_performance
    weight: 6
    params: {start: "date:-45..-14"}
    sql: |
      SELECT c.campaign_name,
             COUNTIF(e.delivered) AS delivered,
             COUNTIF(e.opened) AS opens,
             COUNTIF(e.clicked) AS clicks,
             SAFE_DIVIDE(COUNTIF(e.clicked), COUNTIF(e.delivered)) AS ctr
      FROM `fennmoor-dw.dw_marketing.fct_campaign_engagement` e
      JOIN `fennmoor-dw.dw_marketing.dim_campaign` c ON c.campaign_id = e.campaign_id
      WHERE e.event_date >= '{{start}}'
      [[opt: AND NOT c.is_archived]]
      GROUP BY c.campaign_name
      ORDER BY delivered DESC

  - id: mk.attribution
    weight: 4
    params: {start: "date:-60..-21"}
    sql: |
      SELECT c.campaign_name, COUNT(*) AS conversions, AVG(a.hours_since_send) AS avg_hours_to_convert
      FROM `fennmoor-dw.dw_marketing.fct_campaign_attribution` a
      JOIN `fennmoor-dw.dw_marketing.dim_campaign` c USING (campaign_id)
      WHERE a.conversion_behavior = '[[alt: card_application_submitted ;; checking_account_opened ;; heloc_lead_submitted]]'
        AND DATE(a.conversion_at) >= '{{start}}'
      GROUP BY c.campaign_name
      ORDER BY conversions DESC

  - id: mk.attrition_audience
    by: [dana.whitfield]
    weight: 5
    findings: [F10]
    params: {dec: "choice:8|9|10"}
    sql: |
      SELECT cif_number, attrition_propensity, decile
      FROM sbx_marketing.attrition_propensity_2025
      WHERE model_run_date = (SELECT MAX(model_run_date) FROM sbx_marketing.attrition_propensity_2025)
        AND decile >= {{dec}}

  - id: mk.attrition_vs_churn_v3
    by: [simone.okonkwo]
    weight: 1
    findings: [F10]
    active: {from: 2026-05-20}
    sql: |
      SELECT a.decile, COUNT(*) AS customers, AVG(s.churn_probability) AS avg_v3
      FROM sbx_marketing.attrition_propensity_2025 a
      JOIN `fennmoor-dw.dw_customer.customer_360` c ON c.cif_number = a.cif_number
      JOIN `fennmoor-dw.ml_scores.churn_score_v3` s
        ON s.customer_key = c.customer_key AND s.score_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
      GROUP BY a.decile
      ORDER BY a.decile

  - id: mk.card_spend_deck
    by: [luis.carvajal, dana.whitfield]
    weight: 3
    findings: [F12]
    sql: |
      SELECT segment, month_start, card_spend_usd, cardholders,
             card_spend_usd / cardholders AS spend_per_cardholder
      FROM sbx_marketing.card_spend_by_segment
      ORDER BY month_start DESC, segment

  - id: mk.card_spend_vs_mart
    by: [simone.okonkwo]
    weight: 1
    findings: [F12]
    notes: The two columns differ by exactly 100x. Nobody has asked why yet.
    params: {start: "month:-4..-2"}
    sql: |
      SELECT s.segment, s.month_start, s.card_spend_usd AS sandbox_spend, m.spend AS mart_spend
      FROM sbx_marketing.card_spend_by_segment s
      JOIN (
        SELECT c.segment, DATE_TRUNC(t.post_date, MONTH) AS month_start, SUM(t.amount) AS spend
        FROM `fennmoor-dw.dw_core.fct_card_transactions` t
        JOIN `fennmoor-dw.dw_core.dim_customer` c USING (customer_key)
        WHERE t.is_purchase AND t.post_date >= '{{start}}'
        GROUP BY 1, 2
      ) m USING (segment, month_start)

  - id: mk.ga4_campaign_sessions
    by: [luis.carvajal, dana.whitfield]
    weight: 4
    params: {s1: "suffix:-14..-7", s2: "suffix:-1..-1"}
    sql: |
      SELECT collected_traffic_source.manual_campaign_name AS campaign,
             COUNT(DISTINCT CONCAT(user_pseudo_id, CAST((SELECT value.int_value FROM UNNEST(event_params) WHERE key = 'ga_session_id') AS STRING))) AS sessions
      FROM `fennmoor-raw.analytics_312874659.events_*`
      WHERE _TABLE_SUFFIX BETWEEN '{{s1}}' AND '{{s2}}'
        AND collected_traffic_source.manual_campaign_name IS NOT NULL
      GROUP BY campaign
      ORDER BY sessions DESC

  - id: mk.ga4_page_views_unfiltered
    by: [luis.carvajal]
    weight: 1
    findings: [F09]
    notes: Filters on event_date instead of _TABLE_SUFFIX - scans every shard.
    params: {d: "choice:20260501|20260515|20260601"}
    sql: |
      SELECT (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_location') AS page,
             COUNT(*) AS views
      FROM `fennmoor-raw.analytics_312874659.events_*`
      WHERE event_date >= '{{d}}' AND event_name = 'page_view'
      GROUP BY page
      ORDER BY views DESC
      LIMIT 100

  - id: mk.ga4_page_views
    weight: 2
    params: {s: "suffix:-3..-1"}
    sql: |
      SELECT (SELECT value.string_value FROM UNNEST(event_params) WHERE key = 'page_location') AS page,
             COUNT(*) AS views
      FROM `fennmoor-raw.analytics_312874659.events_*`
      WHERE _TABLE_SUFFIX = '{{s}}' AND event_name = 'page_view'
      GROUP BY page
      ORDER BY views DESC
      LIMIT 100

  - id: mk.engagement_by_segment
    weight: 3
    params: {start: "date:-60..-30", end: "date:-3..-1"}
    sql: |
      SELECT c.segment,
             SAFE_DIVIDE(COUNTIF(e.opened), COUNTIF(e.delivered)) AS open_rate,
             SAFE_DIVIDE(COUNTIF(e.clicked), COUNTIF(e.delivered)) AS click_rate
      FROM `fennmoor-dw.dw_marketing.fct_campaign_engagement` e
      JOIN `fennmoor-dw.dw_core.dim_customer` c ON c.cif_number = e.cif_number
      WHERE e.event_date BETWEEN '{{start}}' AND '{{end}}'
      GROUP BY c.segment

  - id: mk.unsubscribe_trend
    weight: 2
    params: {start: "date:-120..-60"}
    sql: |
      SELECT DATE_TRUNC(event_date, WEEK) AS wk, COUNTIF(unsubscribed) AS unsubscribes, COUNTIF(bounced) AS bounces
      FROM `fennmoor-dw.dw_marketing.fct_campaign_engagement`
      WHERE event_date >= '{{start}}'
      GROUP BY wk
      ORDER BY wk

  - id: mk.affluent_email_audience
    by: [simone.okonkwo]
    weight: 2
    sql: |
      SELECT c.cif_number, c.full_name, c.primary_email
      FROM `fennmoor-dw.dw_customer.customer_360` x
      JOIN `fennmoor-dw.dw_core.dim_customer` c USING (customer_key)
      WHERE x.segment IN ('affluent', 'private') AND c.email_opt_in AND c.primary_email IS NOT NULL

  - id: mk.affluent_list_reuse
    by: [dana.whitfield]
    weight: 2
    active: {from: 2026-04-06}
    notes: Reuses the April extract instead of re-pulling; no opt-in filter.
    sql: |
      SELECT cif_number, full_name, primary_email, segment FROM sbx_marketing.email_list_affluent_apr26 WHERE primary_email IS NOT NULL

  - id: mk.campaign_results_read
    by: [luis.carvajal]
    weight: 3
    cadence: weekly
    sql: |
      select * from sbx_marketing.campain_results_2025 order by open_rate desc limit 50

  - id: mk.web_journeys_read
    by: [luis.carvajal]
    weight: 1
    cadence: weekly
    notes: Always empty (F13).
    sql: |
      select * from sbx_marketing.web_to_branch_journeys order by event_date desc limit 100

  - id: mk.braze_raw_sends
    weight: 2
    params: {d: "date:-3..-1"}
    sql: |
      SELECT channel, COUNT(*) AS sends
      FROM `fennmoor-raw.braze.message_send`
      WHERE DATE(sent_at) = '{{d}}'
      GROUP BY channel

  - id: mk.card_account_mixup
    by: [simone.okonkwo]
    weight: 1
    findings: [F03]
    notes: Joins the card account id to the deposit account id; the integer ranges overlap so it returns rows.
    params: {start: "date:-60..-30"}
    sql: |
      SELECT t.card_account_id, a.product_name, a.open_date, SUM(t.amount) AS spend
      FROM `fennmoor-dw.dw_core.fct_card_transactions` t
      JOIN `fennmoor-dw.dw_core.dim_account` a ON a.core_account_id = t.card_account_id
      WHERE t.post_date >= '{{start}}'
      GROUP BY 1, 2, 3
      LIMIT 1000

  - id: mk.funnel_by_campaign
    weight: 3
    params: {start: "date:-30..-7"}
    sql: |
      SELECT campaign_name, SUM(started) AS started, SUM(submitted) AS submitted,
             SAFE_DIVIDE(SUM(submitted), SUM(started)) AS conversion
      FROM `fennmoor-dw.dw_digital.fct_account_opening_funnel`
      WHERE session_date >= '{{start}}'
      GROUP BY campaign_name
      ORDER BY submitted DESC

  - id: mk.send_volume
    weight: 2
    params: {start: "date:-30..-14", end: "date:-2..-1"}
    sql: |
      SELECT campaign_id, channel, COUNT(*) AS sends, COUNT(DISTINCT customer_key) AS recipients
      FROM `fennmoor-dw.dw_marketing.fct_campaign_sends`
      WHERE sent_date BETWEEN '{{start}}' AND '{{end}}'
      GROUP BY campaign_id, channel

  - id: mk.nbo_card_offers
    weight: 2
    sql: |
      SELECT offer_product_code, COUNT(*) AS customers, AVG(propensity) AS avg_propensity
      FROM `fennmoor-dw.ml_scores.next_best_offer`
      WHERE score_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY) AND rank = 1
      GROUP BY offer_product_code
      ORDER BY customers DESC

  - id: mk.training_set_check
    by: [dana.whitfield]
    weight: 1
    sql: |
      SELECT label_attrited, COUNT(*) AS n, AVG(total_deposit_balance) AS avg_balance
      FROM sbx_dana_whitfield.dana_attrition_training_set
      GROUP BY label_attrited

  - id: mk.borrowed_customer_table
    by: [dana.whitfield]
    weight: 2
    findings: [F14]
    sql: |
      SELECT segment, AVG(churn_risk) AS avg_churn, COUNT(*) AS n FROM sbx_customer_analytics.customer_360_final GROUP BY segment

  # ---- breadth -------------------------------------------------------------
  - id: mk.sends_by_channel_week
    weight: 3
    params: {start: "date:-60..-30"}
    sql: |
      SELECT DATE_TRUNC(sent_date, WEEK) AS wk, channel, COUNT(*) AS sends
      FROM `fennmoor-dw.dw_marketing.fct_campaign_sends`
      WHERE sent_date >= '{{start}}' [[opt: AND channel IN ('email', 'push')]]
      GROUP BY 1, 2
      ORDER BY 1, 2

  - id: mk.send_frequency
    weight: 2
    params: {start: "date:-30..-14"}
    sql: |
      SELECT sends_per_customer, COUNT(*) AS customers
      FROM (
        SELECT customer_key, COUNT(*) AS sends_per_customer
        FROM `fennmoor-dw.dw_marketing.fct_campaign_sends`
        WHERE sent_date >= '{{start}}'
        GROUP BY customer_key
      )
      GROUP BY sends_per_customer
      ORDER BY sends_per_customer

  - id: mk.card_spend_category_mart
    weight: 3
    params: {start: "date:-90..-60"}
    sql: |
      SELECT m.category_group, DATE_TRUNC(t.post_date, MONTH) AS m, SUM(t.amount) AS spend
      FROM `fennmoor-dw.dw_core.fct_card_transactions` t
      JOIN `fennmoor-dw.dw_core.dim_merchant` m USING (merchant_id)
      WHERE t.post_date >= '{{start}}' AND t.is_purchase
      GROUP BY 1, 2
      ORDER BY 2, 3 DESC

  - id: mk.wallet_cards
    weight: 2
    sql: |
      SELECT c.digital_wallet, COUNT(*) AS cards, COUNT(DISTINCT c.cif_number) AS customers
      FROM `fennmoor-dw.dw_core.dim_card` c
      WHERE c.status = 'A' [[opt: AND c.activation_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)]]
      GROUP BY c.digital_wallet

  - id: mk.card_product_mix
    weight: 2
    sql: |
      SELECT p.product_name, COUNT(*) AS open_card_accounts
      FROM `fennmoor-dw.dw_core.dim_account` a
      JOIN `fennmoor-dw.dw_core.dim_product` p USING (product_code)
      WHERE a.account_family = 'CARD' AND a.is_open
      GROUP BY p.product_name
      ORDER BY open_card_accounts DESC

  - id: mk.app_engagement
    weight: 2
    params: {start: "date:-30..-14"}
    sql: |
      SELECT platform, COUNT(DISTINCT cif_number) AS customers, AVG(screens) AS avg_screens
      FROM `fennmoor-dw.dw_digital.fct_app_sessions`
      WHERE session_date >= '{{start}}'
      GROUP BY platform

  - id: mk.funnel_by_device
    weight: 2
    params: {start: "date:-30..-14"}
    sql: |
      SELECT device_category, [[alt: traffic_medium ;; campaign_name]] AS cut,
             SUM(sessions) AS sessions, SAFE_DIVIDE(SUM(submitted), SUM(started)) AS conversion
      FROM `fennmoor-dw.dw_digital.fct_account_opening_funnel`
      WHERE session_date >= '{{start}}'
      GROUP BY 1, 2

  - id: mk.nbo_heloc_targets
    weight: 1
    params: {p: "choice:0.3|0.4|0.5"}
    sql: |
      SELECT n.customer_key, n.propensity, c.total_deposit_balance
      FROM `fennmoor-dw.ml_scores.next_best_offer` n
      JOIN `fennmoor-dw.dw_customer.customer_360` c USING (customer_key)
      WHERE n.score_date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
        AND STARTS_WITH(n.offer_product_code, 'HELOC') AND n.propensity >= {{p}}

  - id: mk.monthly_balance_segments
    weight: 1
    params: {m: "month:-2..-1"}
    sql: |
      SELECT c.segment, AVG(s.avg_daily_total_balance) AS avg_balance, COUNT(*) AS customers
      FROM `fennmoor-dw.dw_customer.customer_monthly_summary` s
      JOIN `fennmoor-dw.dw_core.dim_customer` c USING (customer_key)
      WHERE s.month_start = '{{m}}'
      GROUP BY c.segment

  - id: mk.attribution_by_channel
    weight: 2
    params: {start: "date:-60..-21"}
    sql: |
      SELECT s.channel, a.conversion_behavior, COUNT(*) AS conversions
      FROM `fennmoor-dw.dw_marketing.fct_campaign_attribution` a
      JOIN `fennmoor-dw.dw_marketing.fct_campaign_sends` s ON s.message_send_id = a.attributed_send_id
      WHERE DATE(a.conversion_at) >= '{{start}}'
      GROUP BY 1, 2
