# What is actually going on: the hidden ground truth. Never visible to the customer except through what they perceive, and
# to the rep only through what is elicited.
#
# base_rate         share of the domain's conversations; normalised over the causes eligible for the row
# intents           (optional) the IVR intents the cause can arise under; absent means every intent of its procedure
# needs             what the warehouse must hold for the customer for the cause to be drawn, so the text can name a real
#                   fee or a real purchase. Keys: fee_unwaived_prior_days, card_purchase_prior_days
# confusable_with   causes a customer who misattributes will describe instead (the rep's wrong starting hypothesis)
# manifestations    {id, probability}: how likely each is to be present in the world when this is the cause
#
# Present is not noticed: the discriminating manifestation is usually present and often not volunteered.

# =============================================================================
