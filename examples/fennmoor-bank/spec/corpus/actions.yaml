# Everything a rep can do.
#
# type          verify | elicit | offer | remediate | explain | answer | process | route | transfer | escalate
# elicits       the manifestation this retrieves IF the customer perceived it. Perceived and not asked never reaches the text;
#               this is the mechanism the whole design turns on
# elicits_any   an open question: each perceived, not yet volunteered discriminating manifestation is retrieved with this
#               probability. Cheaper than a targeted question, and never certain
# commits       a terminal action: the walk ends after it
# resolving     an offer: if its efficacy against the real cause is `fixes` the call ends there (the customer accepts);
#               otherwise the walk goes on
# incurs_cost   costs the bank real money when misdirected, which separates a wrong fix that was costly from one that was not

# --- Common ------------------------------------------------------------------
- {id: ACT-VERIFY-IDENTITY, type: verify, label: Verify the caller's identity}
- {id: ACT-STEPUP-VERIFY, type: verify, label: Step-up verification with a one-time code or security questions}
- {id: ACT-TRANSFER-TO-SPECIALIST, type: transfer, label: "Transfer to another queue", commits: true}
- {id: ACT-ESCALATE-TO-SUPERVISOR, type: escalate, label: "Escalate to a supervisor", commits: true}

