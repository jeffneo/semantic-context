# What is perceivable in the world, independent of who notices or says anything.
#
# salience      probability an attentive customer is aware of it at all (scaled by the archetype's attentiveness)
# volunteer     probability a customer who is aware says it unprompted (scaled by the archetype's forthcoming)
# presenting    one of these opens every conversation; it is why the customer called, and says nothing about the cause
# discriminating  separates competing causes. Salience and discriminating are independent: a cause's own presenting
#               complaint is obvious and not discriminating, and the discriminators are what a question has to retrieve
# own           the customer's own situation, act or reason (why they are closing, that they travelled, that they paid):
#               noticed whatever their attentiveness, so only `salience` gates it. What has to be NOTICED (a duplicate charge, a login
#               alert, an earlier waiver) is also scaled by the archetype's attentiveness
# topics        (optional) what a vague presenting manifestation is about, one drawn per conversation, so a general question is
#               about something and the text does not invent a topic that sounds like a cause
# checkable     (default true) asking directly can retrieve it. False is a pattern the customer would have to have spotted
#
# The gap that matters is perceived-but-not-volunteered: high salience, low volunteer, discriminating. A rep who asks gets
# it, a rep who doesn't doesn't, and the same customer with the same cause ends differently. That is the structure the
# process graph is later asked to recover, and the reason a question has value.

