      - {site_id: MNL, site_name: Manila BPO, city: Manila, state: "", country: PHL, operator: Harbinger BPO Services, is_outsourced: true, seat_count: 520, go_live_date: 2023-02-01, genesys_queue_prefix: MNL_}
