# Per-table structure. Keys:
#   rows        a fixed count (else the scaled spec count)
#   fixed       literal rows, for tiny reference tables
#   parents     tables each row belongs to: {table: {per: [min, max] | share: p}}; the first is
#               the main parent. A column whose concept matches a parent column's concept
#               copies the parent's value, so a row's ids are consistent with each other.
#   daily       one row per parent row per day of the window
#   columns     rules for single columns (see fill.py: Rules)
#   sql         generate in BigQuery after the tables it reads (keys the warehouse computes)
tables:
  gl_erp.cost_center:
    columns:
      cost_center_name: {words: [Retail Banking, Card Services, Contact Center, Operations, Technology, Finance, Risk, Marketing]}
      department_code: {pattern: "D{n:03d}", start: 100}
      is_active: {bool: 0.92}

  workday.worker:
    columns:
      job_profile: {words: [Customer Service Representative, Relationship Banker, Operations Analyst, Software Engineer, Risk Analyst, Collector, Branch Manager]}
      termination_date: {null_unless: {worker_status: [Terminated]}, after: hire_date}

  reference_data.contact_center_site:
    fixed:
      - {site_id: TUL, site_name: Tulsa Contact Center, city: Tulsa, state: OK, country: USA, operator: Fennmoor Bank, is_outsourced: false, seat_count: 420, go_live_date: 2011-03-01, genesys_queue_prefix: TUL_}
