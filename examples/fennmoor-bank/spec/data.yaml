  ml_scores.churn_score_v3:
    # Vertex scores dim_customer nightly from the v3 cutover (2026-05-15): keys come from
    # the warehouse, so the rows are written in BigQuery after dim_customer exists.
    sql: |
      SELECT d AS score_date, c.customer_key,
             ROUND(MOD(ABS(FARM_FINGERPRINT(CONCAT(c.cif_number, CAST(d AS STRING)))), 10000) / 10000 * 0.6
                   + IF(c.customer_status = 'A', 0, 0.35), 4) AS churn_probability,
             CASE WHEN MOD(ABS(FARM_FINGERPRINT(c.cif_number)), 100) < 8 THEN 'HIGH'
                  WHEN MOD(ABS(FARM_FINGERPRINT(c.cif_number)), 100) < 30 THEN 'MEDIUM' ELSE 'LOW' END AS risk_band,
             ['TENURE', 'BALANCE_TREND', 'CONTACT_RATE'] AS top_reason_codes,
             'churn-v3.0.2' AS model_version
      FROM `fennmoor-dw.dw_core.dim_customer` c,
           UNNEST(GENERATE_DATE_ARRAY(DATE '2026-05-15', DATE '2026-06-29')) AS d
    depends_on: [fennmoor-dw.dw_core.dim_customer]

  # ---------------------------------------------------------------- slice 2: the gold questions

  # Finance: journal lines, a quarter of them on the contact-center sites' cost centers (Q01's costs)
  gl_erp.gl_account:
    columns:
      account_type: {choice: {EXPENSE: 55, REVENUE: 15, ASSET: 12, LIABILITY: 12, EQUITY: 6}}
      account_name: {words: [Salaries and Wages, Contractor Services, Telephony, Rent and Occupancy, Software Licenses, Interest Income, Fee Income, Travel, Training]}
      is_active: {bool: 0.93}

  gl_erp.journal_line:
    needs: [reference_data.contact_center_site, gl_erp.gl_account]
    window: [2025-01-01, 2026-06-29]  # Q01 asks for last year's costs: the GL keeps history
    columns:
      cost_center_id: {some_from: {table: reference_data.contact_center_site, column: cost_center_id, share: 0.25}}
      period_name: {derive: period_name, of: accounting_date}
      source: {choice: {PAYROLL: 45, AP: 30, ALLOC: 15, ACCRUAL: 10}}
      entered_dr: {range: [40.0, 18000.0]}
      entered_cr: {const: "0.00"}
      currency_code: {const: USD}
      line_description: {words: [Biweekly payroll, Vendor invoice, Overhead allocation, Month-end accrual, Telephony charges]}

  gl_erp.vendor_invoice:
    columns:
      vendor_name: {words: [Harbinger BPO Services, Genesys Cloud, Verizon Business, Iron Mountain, Deloitte, Workday]}
      amount: {range: [200.0, 60000.0]}
      line_description: {words: [Monthly services, License renewal, Professional services]}

  gl_erp.CC_EXPENSE_SUMMARY:
    columns:
      PERIOD_NAME: {choice: [MAR-26, APR-26, MAY-26, JUN-26]}
      ACTUAL_AMT: {range: [1000.0, 250000.0]}
      BUDGET_AMT: {range: [1000.0, 250000.0]}
      VARIANCE_AMT: {range: [-40000.0, 40000.0]}

  # Fraud: cases link 1-5 alerts each; share of alerts in a confirmed case is Q07's answer
  fraud_platform.alert:
    columns:
      alert_status: {choice: {CLOSED: 85, OPEN: 10, ESCALATED: 5}}
      priority: {choice: {LOW: 50, MEDIUM: 35, HIGH: 15}}
      channel: {choice: {CNP: 30, CP: 12, ONLINE: 22, MOBILE: 20, BRANCH: 5, ATM: 6, P2P: 5}}
      disposition: {choice: {FALSE_POSITIVE: 78, CONFIRMED: 12, INCONCLUSIVE: 6, CUSTOMER_VERIFIED: 4}}
      rule_id: {pool: {pattern: "R{n:03d}", size: 60}}
      model_score: {range: [0, 999]}
      entity_ref: {pool: {pattern: "ENT{n:07d}", size: 200000}}
      dispositioned_at: {after_seconds: alert_ts, seconds: [600, 604800]}

  fraud_platform.fraud_case:
    columns:
      case_type: {choice: {CARD: 45, ACCOUNT: 25, P2P: 15, CHECK: 10, ELDER: 5}}
      status: {choice: {CLOSED: 80, OPEN: 20}}
