  # Scores: v2 stops at the v3 cutover (2026-05-15), the planted stale score (Q02's trap)
  ml_scores.churn_score_v2:
    sql: |
      SELECT d AS score_date, c.customer_key, c.cif_number,
             ROUND(MOD(ABS(FARM_FINGERPRINT(CONCAT('v2', c.cif_number, CAST(d AS STRING)))), 10000) / 10000 * 0.7
                   + IF(c.customer_status = 'A', 0, 0.25), 4) AS churn_score,
             'churn-v2.4.1' AS model_version
      FROM `fennmoor-dw.dw_core.dim_customer` c,
           UNNEST(GENERATE_DATE_ARRAY(DATE '2026-02-15', DATE '2026-05-14')) AS d
