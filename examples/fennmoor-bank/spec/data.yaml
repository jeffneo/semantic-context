# =============================================================================
# Data fill - what generate/fill.py needs beyond the table specs
# =============================================================================
# The table specs give every column's type, concept and flags, and their comments
# give most code values. This file adds what they don't: scale, how tables hang
# together (which rows a row belongs to), identifier formats, and the value domains
# the comments leave out. Plan: plans/2026-09-26-fill-the-estate.md.
#
# Only base tables are generated. Every derived table is computed in BigQuery by
# its own model SQL, so lineage and joins in the data are correct by construction.
# =============================================================================

seed: 20260926
scale:
  entities: 0.01            # share of the spec's `rows` for entity tables
  events: 0.001             # for tables of 100M+ rows (event_threshold)
  event_threshold: 100000000
  cap: 5000000              # rows per table, at most
  reference_below: 50000    # tables smaller than this keep their full size (branches, products, queues)
dates:
  history_start: 2015-01-01 # the earliest opening, enrolment or creation date
  window: [2026-04-01, 2026-06-29]   # the simulated log window; events fall inside it
  as_of: 2026-06-29         # "today" for the model SQL (CURRENT_DATE) and for snapshots

slices:
  1:
    title: Customer context
    targets: [customer_360, dim_customer, dim_account, dim_card, dim_branch, dim_product,
              fct_card_transactions, fct_deposit_transactions, int_customer_identity,
              int_account_holders, fct_account_closures, fct_calls, dim_agent, dim_queue,
              dim_cc_site, dim_merchant]

# How each id space's values look (concepts.yaml gives the prose). `seq` counts up
# from `start`; `pattern` fills {n} (the sequence number) and {h} (hex from a seeded hash).
formats:
  customer.cif:          {pattern: "{n:010d}", start: 1000017}          # 10-digit zero-padded
  deposit_account.id:    {int: true, start: 40010000, step: 7}          # 7-9 digits
  card_account.id:       {int: true, start: 40010350, step: 5}          # overlaps core account ids: the planted homonym
  deposit_account.number: {pattern: "{n:012d}", start: 610000000000}
  deposit_txn.id:        {int: true, start: 900000000001}
  card.token:            {pattern: "tok_{h:24}"}
  card_txn.id:           {pattern: "STL{n:012d}", start: 1}
  card_auth.id:          {pattern: "AUTH{n:012d}", start: 1}
  merchant.id:           {pattern: "MID{n:09d}", start: 100000}
  merchant.mcc:          {pattern: "{n:04d}", start: 1711, step: 7}
  product.code:          {from_domain: product_codes}
  branch.id:             {int: true, start: 101, step: 3}               # 3-4 digits
  customer.olb_user_id:  {pattern: "olb_{h:12}"}
  customer.sf_contact_id: {pattern: "003{h:15}"}                        # 18 characters, Contact prefix
  customer.sf_household_id: {pattern: "001{h:15}"}                      # Account prefix
  braze.user_id:         {pattern: "{h:24}"}
  call.conversation_id:  {uuid: true}
  call.participant_id:   {uuid: true}
  queue.id:              {uuid: true}
  agent.genesys_user_id: {uuid: true}
  call.wrapup_code:      {uuid: true}
  employee.id:           {pattern: "W{n:06d}", start: 100001}
  finance.cost_center_id: {pattern: "CC{n:04d}", start: 1001}
  cc_site.id:            {from_rows: true}
  loan.id:               {pattern: "LN{n:010d}", start: 3000000001}
  loan.application_id:   {pattern: "APP{n:09d}", start: 500000001}
  geo.zip:               {pattern: "{n:05d}", start: 60001, step: 1}
  crm.user_id:           {pattern: "005{h:15}"}
  genesys.division_id:   {choice: [div-retail-service, div-card-services, div-collections]}
  atm.id:                {pattern: "ATM{n:05d}", start: 1}

