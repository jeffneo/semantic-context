  fraud_platform.case_alert_link:
    parents: {fraud_platform.fraud_case: {per: [1, 5]}, fraud_platform.alert: {unique: true}}

  fraud_platform.model_score_realtime:
    rows: 1000000                     # the spec's 7.6 billion at 0.1% is 7.6 million; a million shows the trap
    columns:
      entity_type: {choice: {CARD: 60, ACCOUNT: 25, OLB_SESSION: 15}}
      entity_ref: {pool: {pattern: "ENT{n:07d}", size: 200000}}
      model_name: {choice: {fraud-gbm-rt: 70, ato-nn: 30}}
      model_version: {choice: [4.2.0, 4.3.1]}
      score: {range: [0, 999]}

  # Contact center: CSAT on one conversation in nine (Q10)
  genesys_cloud.survey_response:
    parents: {genesys_cloud.conversation: {share: 0.11}}
    columns:
      sent_at: {after_seconds: conversation_end, seconds: [60, 3600], of_parent: true}
