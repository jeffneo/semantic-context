    columns:
      - "alert_id | STRING || aml.alert_id | pk required"
      - "party_id | STRING || customer.aml_party_id"
      - "scenario_code | STRING"                             # STRUCTURING, RAPID_MOVE, HIGH_RISK_GEO, CASH_INTENSIVE
      - "alert_date | DATE || date.day"
      - "total_amount | NUMERIC || money.txn_amount | unit=usd"
