L9890546d:
  question: For customers scored for churn risk on 2026-05-22, split them into ten equal-sized groups (deciles)
    from lowest to highest churn probability. For each decile, what is the number of customers, the share of those
    customers who voluntarily closed their account after 2026-05-19, and the average churn probability?
  compare:
  - decile
  - n
  - closed_rate
  - avg_p
  unstated_filters: []
  shape: 9890546d4de0c0d59ecec72c68a2a15b803a35b4ef321b4815d4ce96756f082c
  who: an analyst
  tables:
  - fennmoor-dw.dw_core.fct_account_closures
  - fennmoor-dw.ml_scores.churn_score_v3
  sql: "WITH scored AS (\n  SELECT customer_key, churn_probability,\n         NTILE(10) OVER (ORDER BY churn_probability)\
    \ AS decile\n  FROM `fennmoor-dw.ml_scores.churn_score_v3`\n  WHERE score_date = '2026-05-22'\n),\nclosed AS\
    \ (\n  SELECT DISTINCT customer_key\n  FROM `fennmoor-dw.dw_core.fct_account_closures`\n  WHERE close_date >\
    \ '2026-05-19' AND is_voluntary\n)\nSELECT decile, COUNT(*) AS n,\n       COUNTIF(closed.customer_key IS NOT\
    \ NULL) / COUNT(*) AS closed_rate,\n       AVG(churn_probability) AS avg_p\nFROM scored LEFT JOIN closed USING\
    \ (customer_key)\nGROUP BY decile\nORDER BY decile\n"
