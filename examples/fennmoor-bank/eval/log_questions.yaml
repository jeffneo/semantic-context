L5bac0ee7:
  question: As of 2026-04-05, for each loan product and branch, what is the count of open loans, the count of those
    loans that are 30 or more days past due, and the resulting delinquency rate (delinquent count divided by open
    count)? Order the results from highest to lowest delinquency rate.
  compare:
  - PRODUCT_CODE
  - BRANCH_NAME
  - N
  - DLQ
  - RATE
  unstated_filters: []
  shape: 5bac0ee7b30e8a143ceff4e44907168e1c6b89a77c913197b2a8eaf33004d59e
  who: an analyst
  tables:
  - fennmoor-dw.dw_core.dim_account
  - fennmoor-dw.dw_core.dim_branch
  - fennmoor-dw.dw_risk.fct_delinquency_daily
  sql: "WITH OPEN_LOANS AS (\n  SELECT PRODUCT_CODE, BRANCH_ID, COUNT(*) AS N\n  FROM `fennmoor-dw.dw_core.dim_account`\n\
    \  WHERE ACCOUNT_FAMILY = 'LOAN' AND IS_OPEN\n  GROUP BY 1, 2\n),\nDLQ AS (\n  SELECT A.PRODUCT_CODE, A.BRANCH_ID,\
    \ COUNT(*) AS D\n  FROM `fennmoor-dw.dw_risk.fct_delinquency_daily` DD\n  JOIN `fennmoor-dw.dw_core.dim_account`\
    \ A USING (ACCOUNT_KEY)\n  WHERE DD.SNAPSHOT_DATE = '2026-04-05' AND DD.DPD >= 30\n  GROUP BY 1, 2\n)\nSELECT\
    \ O.PRODUCT_CODE, B.BRANCH_NAME, O.N, COALESCE(DLQ.D, 0) AS DLQ, SAFE_DIVIDE(DLQ.D, O.N) AS RATE\nFROM OPEN_LOANS\
    \ O\nLEFT JOIN DLQ USING (PRODUCT_CODE, BRANCH_ID)\nLEFT JOIN `fennmoor-dw.dw_core.dim_branch` B ON B.BRANCH_ID\
    \ = O.BRANCH_ID\nORDER BY RATE DESC\n"
