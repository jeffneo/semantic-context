    FROM `fennmoor-raw.analytics_312874659.events_*`\nWHERE _TABLE_SUFFIX BETWEEN '20260507' AND '20260517'\n  AND\
    \ collected_traffic_source.manual_campaign_name IS NOT NULL\nGROUP BY campaign\nORDER BY sessions DESC\n"
