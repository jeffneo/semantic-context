L0726bed6:
  question: For the period from 2026-05-07 to 2026-05-17, how many distinct sessions did each marketing campaign
    (with a named campaign) generate, ranked from the highest number of sessions to the lowest?
  compare:
  - campaign
  - sessions
  unstated_filters: []
  shape: 0726bed6fb5018f1a7465fc8995bfbf7dcc69c0ce92fff1505696fee707b6a14
  who: an analyst
  tables:
  - fennmoor-raw.analytics_312874659.events_*
  sql: "SELECT collected_traffic_source.manual_campaign_name AS campaign,\n       COUNT(DISTINCT CONCAT(user_pseudo_id,\
