  - fennmoor-raw.gl_erp.journal_line
  - fennmoor-raw.gl_erp.vendor_invoice
  sql: "SELECT s.site_id, gl.m, gl.gl_expense + IFNULL(ap.invoices, 0) AS total_site_cost\nFROM (\n  SELECT cost_center_id,\
    \ DATE_TRUNC(accounting_date, MONTH) AS m, SUM(entered_dr - entered_cr) AS gl_expense\n  FROM `fennmoor-raw.gl_erp.journal_line`\n\
    \  WHERE accounting_date >= '2025-10-01'\n  GROUP BY 1, 2\n) gl\nJOIN `fennmoor-dw.dw_contact_center.dim_cc_site`\
    \ s ON s.cost_center_id = gl.cost_center_id\nLEFT JOIN (\n  SELECT cost_center_id, DATE_TRUNC(invoice_date,\
    \ MONTH) AS m, SUM(amount) AS invoices\n  FROM `fennmoor-raw.gl_erp.vendor_invoice`\n  GROUP BY 1, 2\n) ap ON\
    \ ap.cost_center_id = gl.cost_center_id AND ap.m = gl.m\nORDER BY 1, 2\n"
