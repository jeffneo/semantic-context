# Everything the pipeline knows about the estate besides what it reads from BigQuery.
# Nothing here describes meaning or relationships - only where to read and how to
# normalize names. The pipeline never reads specs/ (see plans/PIPELINE_PLAN.md §0).

bigquery:
  project: jeffdavis-bq-testproj      # hosts the log and the physical catalog
  gcloud_config: qlsc                 # service-account impersonation config; never the default one
  location: US
  # Stands in for `region-us`.INFORMATION_SCHEMA.JOBS; same schema, so the T0 SQL is identical.
  log_table: fnb_query_log.jobs
  # The estate's datasets were deployed as <prefix><logical dataset> in one project.
  # Which logical project each dataset belongs to is learned from the log's
  # referenced_tables / destination_table, not configured.
  dataset_prefix: fnb_
  exclude_datasets: [fnb_query_log]
  # The business's local time zone, for working-hours and schedule features (Stage 3).
  timezone: America/Chicago

# Volatile identifiers that name the same object across runs. Applied to the table
# name (last path segment) in fingerprints and in graph identity. Order matters.
# Date shards are not listed: shard families are learned from the catalog (2+ tables
# sharing a prefix with a YYYYMMDD/YYYYMM suffix), so a one-off backup such as
# CUST_MSTR_BKP_20250211 keeps its name.
canonical_identifiers:
  - {pattern: '_[0-9a-f]{12,}$',              replace: '_{hex}'}     # fivetran_staging.<table>_<hex>
  - {pattern: '^LR_[0-9A-Z]{10,30}_',            replace: 'LR_{id}_'}   # Looker PDT generations
  - {pattern: '^anon[0-9a-f_]{20,}$',         replace: 'anon{id}'}   # anonymous query results

parser:
  url: http://localhost:8090
  batch_size: 200
  concurrency: 8

neo4j:
  uri: bolt://localhost:7690          # NEO4J_BOLT_PORT in .env
  database: bigquery                  # the bottom layer (7 labels); `semanticlayer` keeps the M1-M6 build as it was
  user: neo4j                         # password: NEO4J_PASSWORD in .env

llm:
  provider: anthropic                 # key: ANTHROPIC_API_KEY in .env
  model: claude-haiku-4-5-20251001    # requested "Haiku 5"; not on this account - newest Haiku. One line to change.
  concurrency: 6

embeddings:
  provider: azure_openai              # AZURE_OPENAI_API_KEY / _ENDPOINT / _API_VERSION in .env
  deployment: text-embedding-3-large
  dimensions: 512

qa:                                   # pipeline/answer.py: the question-answering agent
  model: claude-haiku-4-5-20251001    # same fast model as naming (D4); one line to change
