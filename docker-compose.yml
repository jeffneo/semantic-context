name: qlsc

# Neo4j Enterprise with GDS and APOC, the SQL parse service, and (profile `nes`) Enterprise Studio.
# The pipeline uses quantified path patterns, scoped CALL () subqueries and GDS Cypher projections; the image is
# pinned to the release it was built and tested on. Create the target database (neo4j.database in the
# estate's config) once: CREATE DATABASE bigquery.

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.07.1-enterprise}
    container_name: qlsc-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-4G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2G}
      NEO4J_gds_enterprise_license__file: /licenses/gds.license
      # Bolt TLS, optional: plain clients keep working, and a remote alias (which accepts only neo4j+s or
      # neo4j+ssc) can reach this instance. Self-signed; make it once (see docker/tls/README.md).
      NEO4J_server_bolt_tls__level: OPTIONAL
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /ssl/bolt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ${GDS_LICENSE_PATH:-./gds.license}:/licenses/gds.license:ro
      - ./docker/tls/bolt:/ssl/bolt:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # ---------------------------------------------------------------------------
  # SQL parse service (parser/). Stateless: reads only the catalog snapshot that
  # `qlsc extract` writes to the estate's work directory (QLSC_WORK). The same
  # image is what would run on Cloud Run / Lambda.
  # ---------------------------------------------------------------------------
  parser:
    build: ./parser
    image: qlsc-parse:0.1.0
    container_name: qlsc-parser
    environment:
      CATALOG_PATH: /catalog/catalog.json
      WEB_CONCURRENCY: ${PARSER_WORKERS:-4}
    ports:
      - "${PARSER_PORT:-8090}:8080"
    volumes:
      - ${QLSC_WORK:-./examples/fennmoor-bank/work}:/catalog:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # Neo4j Enterprise Studio. Behind the `nes` profile so plain `up` stays fast.
  # ---------------------------------------------------------------------------

  # One-shot provisioner: service account, asset database, Bloom/sharing grants.
  nes-init:
    image: ${NEO4J_IMAGE:-neo4j:2026.07.1-enterprise}
    container_name: qlsc-nes-init
    profiles: ["nes"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./docker/nes/nes-setup.cypher:/nes-setup.cypher:ro
      - ./docker/nes/nes-init.sh:/nes-init.sh:ro
    environment:
      # cypher-shell reads these natively, which keeps the admin password out
      # of the command line.
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      TOOLS_PASSWORD: ${NES_TOOLS_PASSWORD:?set NES_TOOLS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "/nes-init.sh"]
    restart: "no"

  enterprise-studio:
    image: neo4j/enterprise-studio:latest
    container_name: qlsc-nes
    profiles: ["nes"]
    depends_on:
      nes-init:
        condition: service_completed_successfully
    # Studio exits if it loses its asset store, which happens whenever Neo4j
    # restarts under it.
    restart: unless-stopped
    ports:
      - "${NES_PORT:-8080}:8080"
    volumes:
      - ${NES_LICENSE_PATH:-./nes.license}:/licenses/nes.license:ro
    environment:
      NES_license_path: "/licenses/nes.license"
      NES_server_port: "8080"

      # Where Studio persists dashboards, saved queries, and Perspectives.
      # Must match docker/nes/nes-setup.cypher.
      NES_assetStore_default_uri: "neo4j://neo4j:7687"
      NES_assetStore_default_database: "tools-storage"
      NES_assetStore_default_authentication_basic_username: "tools_service"
      NES_assetStore_default_authentication_basic_password: ${NES_TOOLS_PASSWORD:?set NES_TOOLS_PASSWORD in .env}

      # The deployment users query. Proxy mode over the HTTP connector.
      NES_neo4jDeployments_qlsc_name: "query-log-semantic-context"
      NES_neo4jDeployments_qlsc_uri: "http://neo4j:7474"
    healthcheck:
      # The Studio image ships no curl or wget, so check the listener on 8080
      # (hex 1F90) via /proc instead.
      test: ["CMD-SHELL", "grep -q ':1F90 ' /proc/net/tcp6 /proc/net/tcp 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Neo4j Virtual Graph over the warehouse (profile `vg`). A separate instance, as
  # the Virtual Graph docs recommend: its default database is the virtual graph
  # that `qlsc virtualize` writes to QLSC_WORK/virtual/. The model is read at boot;
  # restart after re-running virtualize. BigQuery credentials: VG_CREDENTIALS, a
  # gcloud application-default credentials file (see docker/nvg/README.md).
  # ---------------------------------------------------------------------------
  neo4j-vg:
    image: ${NEO4J_VG_IMAGE:-neo4j:2026.09.0-enterprise}
    container_name: qlsc-neo4j-vg
    profiles: ["vg"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_internal_virtual__graph_enabled: "true"
      NEO4J_internal_virtual__graph_home: /nvg_home
      NEO4J_server_memory_heap_max__size: ${NEO4J_VG_HEAP:-2G}
      GOOGLE_APPLICATION_CREDENTIALS: /nvg_home/credentials.json
      # A local keystore, for the credentials of the remote aliases a composite database uses (see
      # docker/nvg/README.md).
      # Make it once: docker exec qlsc-neo4j-vg keytool -genseckey -keyalg aes -keysize 256 \
      #   -storetype pkcs12 -keystore /nvg_home/neo4j.keystore -alias neo4j -storepass <password>
      NEO4J_dbms_security_keystore_path: /nvg_home/neo4j.keystore
      NEO4J_dbms_security_keystore_password: ${VG_KEYSTORE_PASSWORD:-qlsc-local-keystore}
      NEO4J_dbms_security_key_name: neo4j
      # Bolt TLS, as on neo4j: a composite reaches this instance's own virtual graph through a remote alias.
      NEO4J_server_bolt_tls__level: OPTIONAL
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /ssl/bolt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE
    ports:
      - "${NEO4J_VG_HTTP_PORT:-7478}:7474"
      - "${NEO4J_VG_BOLT_PORT:-7692}:7687"
    volumes:
      - ${QLSC_WORK:-./examples/fennmoor-bank/work}/virtual:/nvg_home
      - ${VG_CREDENTIALS:?set VG_CREDENTIALS in .env}:/nvg_home/credentials.json:ro
      - ./docker/nvg/google-cloud-bigquery-jdbc-1.0.0-all.jar:/var/lib/neo4j/lib/google-cloud-bigquery-jdbc-1.0.0-all.jar
      - ./docker/tls/bolt:/ssl/bolt:ro
      - neo4j-vg-data:/data

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-vg-data:
